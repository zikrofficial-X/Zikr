apply plugin: 'com.android.application'

android {
    namespace "com.zikr.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zikr.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "1.4.22"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/com/android/build/gradle/app-metadata.properties',
                'META-INF/version-control-info.textproto',
                'META-INF/*.version',
                'META-INF/androidx.*.version',
                'META-INF/kotlinx_coroutines_*.version',
                'META-INF/**/*.version',
                'META-INF/services/**'
            ]
        }
    }

    def signingPropertiesFile = rootProject.file('keystore.properties')
    def signingProperties = new Properties()
    if (signingPropertiesFile.exists()) {
        signingProperties.load(new FileInputStream(signingPropertiesFile))
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storeType signingProperties.getProperty('storeType', 'PKCS12')
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.appcompat:appcompat:1.7.1'
}

apply from: 'capacitor.build.gradle'

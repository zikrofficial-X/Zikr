# Project-wide Gradle settings.

# Keep CI release builds within the GitHub-hosted runner memory envelope.
# The previous 256m metaspace cap caused repeated java.lang.OutOfMemoryError: Metaspace
# during signed APK/AAB builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Release builds use two workers in CI so independent Android tasks can run in parallel.
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

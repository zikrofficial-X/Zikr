version: 2.1

parameters:
  run_automation:
    type: boolean
    default: false

jobs:
  verify:
    docker:
      - image: cimg/node:22.13
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enable pnpm
          command: |
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            pnpm --version
      - restore_cache:
          keys:
            - zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - zikr-pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Run full verification suite
          command: pnpm verify
          no_output_timeout: 20m

  production-smoke:
    docker:
      - image: cimg/node:22.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify production deployment is healthy
          command: |
            set -euo pipefail
            echo "Waiting 90s for Vercel deployment to propagate..."
            sleep 90
            for attempt in $(seq 1 20); do
              if node scripts/smoke-production-routes.mjs "https://zikrmediaofficial.vercel.app"; then
                exit 0
              fi
              echo "Production smoke attempt ${attempt}/20 failed; retrying"
              sleep 45
            done
            echo "Production smoke checks failed after 20 attempts" >&2
            exit 1
          no_output_timeout: 30m

  android-release:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4096m"
    steps:
      - checkout
      - run:
          name: Enable pnpm
          command: |
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Install Android SDK packages
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"
      - restore_cache:
          keys:
            - zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - zikr-pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Verify web application
          command: pnpm verify
          no_output_timeout: 20m
      - run:
          name: Build web assets and sync Capacitor
          command: |
            pnpm build
            pnpm exec cap sync android
          no_output_timeout: 20m
      - run:
          name: Verify mobile configuration
          command: MOBILE_RELEASE_CHECK=1 pnpm mobile:check
          environment:
            ANDROID_APP_LINKS_SHA256: ${ANDROID_APP_LINKS_SHA256}
      - run:
          name: Restore release keystore
          shell: /bin/bash
          command: |
            set -euo pipefail
            for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GH_TOKEN; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing protected CircleCI environment variable: ${name}" >&2
                exit 1
              fi
            done
            mkdir -p "$CIRCLE_WORKING_DIRECTORY/.circleci-signing"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CIRCLE_WORKING_DIRECTORY/.circleci-signing/zikr-release.keystore"
            cat > android/keystore.properties <<EOF
            storeFile=$CIRCLE_WORKING_DIRECTORY/.circleci-signing/zikr-release.keystore
            storeType=jks
            storePassword=$ANDROID_KEYSTORE_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            keyPassword=$ANDROID_KEY_PASSWORD
            EOF
            chmod 600 android/keystore.properties
      - run:
          name: Build signed APK and AAB
          command: |
            cd android
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2
          no_output_timeout: 30m
      - run:
          name: Verify package and signature
          shell: /bin/bash
          command: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
            test -x "$APKSIGNER"
            "$APKSIGNER" verify --verbose "$APK"
            sha256sum "$APK" "$AAB" | tee SHA256SUMS
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort -V | tail -1)"
            test -x "$APKANALYZER"
            "$APKANALYZER" manifest application-id "$APK" | grep -Fx 'com.zikr.app'
      - run:
          name: Publish GitHub Release
          shell: /bin/bash
          command: |
            set -euo pipefail
            if gh release view "$CIRCLE_TAG" --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" >/dev/null 2>&1; then
              gh release upload "$CIRCLE_TAG" \
                android/app/build/outputs/apk/release/app-release.apk \
                android/app/build/outputs/bundle/release/app-release.aab \
                SHA256SUMS \
                --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
                --clobber
            else
              gh release create "$CIRCLE_TAG" \
                android/app/build/outputs/apk/release/app-release.apk \
                android/app/build/outputs/bundle/release/app-release.aab \
                SHA256SUMS \
                --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
                --verify-tag \
                --generate-notes \
                --title "ZIKR $CIRCLE_TAG"
            fi
      - run:
          name: Remove signing material
          when: always
          command: rm -f android/keystore.properties .circleci-signing/zikr-release.keystore

  automate-content:
    docker:
      - image: cimg/node:22.13
    resource_class: small
    working_directory: ~/zikr
    steps:
      - checkout
      - run:
          name: Install rendering tools
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - run:
          name: Enable pnpm
          command: |
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - restore_cache:
          keys:
            - zikr-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - zikr-pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Validate automation environment
          shell: /bin/bash
          command: |
            set -euo pipefail
            for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required CircleCI project environment variable: ${name}" >&2
                exit 1
              fi
            done
      - run:
          name: Run autonomous content and publishing queues
          environment:
            VIDEO_GENERATOR: template
            AUTO_VIDEO_ENABLED: "true"
            AUTO_VIDEO_BATCH_SIZE: "1"
            VIDEO_BACKGROUND_BATCH_SIZE: "1"
            SOCIAL_BACKGROUND_BATCH_SIZE: "10"
            BACKGROUND_JOB_TARGET: all
          command: pnpm automation:run
          no_output_timeout: 15m

workflows:
  verify-on-change:
    jobs:
      - verify
      - production-smoke:
          requires:
            - verify
          filters:
            branches:
              only: main

  android-release-on-tag:
    jobs:
      - android-release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

  scheduled-automation:
    when: << pipeline.parameters.run_automation >>
    jobs:
      - automate-content

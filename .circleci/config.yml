version: 2.1

jobs:
  ci-check:
    docker:
      - image: cimg/node:22.11.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm install --frozen-lockfile
      - run:
          name: Run CI checks
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm imports:check
            pnpm mobile:check
            pnpm offline:check
            pnpm project:check
            pnpm lint
            pnpm check
            pnpm test
            pnpm build
          no_output_timeout: 20m

  android-rebuild:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    environment:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.jvmargs=-Xmx1536m
        -XX:MaxMetaspaceSize=384m
        -Dfile.encoding=UTF-8
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Select supported Java runtime
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            echo "export JAVA_HOME=$JAVA_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"
            java -version
      - run:
          name: Install Android SDK packages
          shell: /bin/bash
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm install --frozen-lockfile
      - run:
          name: Build web assets and sync Capacitor
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm build
            pnpm mobile:prepare
            pnpm exec cap sync android
          no_output_timeout: 20m
      - run:
          name: Restore and validate release keystore
          shell: /bin/bash
          command: |
            set -euo pipefail
            REQUIRED_VARS=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
            for name in "${REQUIRED_VARS[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing protected CircleCI environment variable: ${name}" >&2
                exit 1
              fi
            done
            SIGNING_DIR="$CIRCLE_WORKING_DIRECTORY/.circleci-signing"
            KEYSTORE_PATH="$SIGNING_DIR/zikr-release.keystore"
            PROPERTIES_PATH="$CIRCLE_WORKING_DIRECTORY/android/keystore.properties"
            mkdir -p "$SIGNING_DIR"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            keytool -list -v -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            printf '%s\n' \
              "storeFile=$KEYSTORE_PATH" \
              "storeType=PKCS12" \
              "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
              "keyAlias=$ANDROID_KEY_ALIAS" \
              "keyPassword=$ANDROID_KEY_PASSWORD" \
              > "$PROPERTIES_PATH"
            chmod 600 "$PROPERTIES_PATH"
      - run:
          name: Build signed APK and AAB
          shell: /bin/bash
          command: |
            set -euo pipefail
            cd android
            ./gradlew clean
            ./gradlew :app:assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8"
            ./gradlew :app:bundleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8"
          no_output_timeout: 30m
      - run:
          name: Verify APK, AAB, signature and version
          shell: /bin/bash
          command: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
            "$APKSIGNER" verify --verbose "$APK"
            "$APKANALYZER" manifest application-id "$APK" | grep -Fx 'com.zikr.app'
            VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)"
            test -n "$VERSION_NAME"
            if [[ "${CIRCLE_TAG:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              EXPECTED_VERSION="${CIRCLE_TAG#v}"
              test "$VERSION_NAME" = "$EXPECTED_VERSION"
            fi
            echo "Verified APK version: $VERSION_NAME"
            sha256sum "$APK" "$AAB" > SHA256SUMS
            cat SHA256SUMS
      - run:
          name: Verify GitHub CLI authentication
          shell: /bin/bash
          command: |
            set -euo pipefail
            test -n "${GH_TOKEN:-}"
            gh --version
            gh auth status
      - run:
          name: Publish Android release assets
          shell: /bin/bash
          command: |
            set -euo pipefail
            test -n "${CIRCLE_TAG:-}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            RELEASE_TAG="$CIRCLE_TAG"
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$APK" "$AAB" SHA256SUMS --repo "$REPO" --clobber
            else
              gh release create "$RELEASE_TAG" "$APK" "$AAB" SHA256SUMS --repo "$REPO" --verify-tag --generate-notes --title "ZIKR $RELEASE_TAG"
            fi
            echo "Published Android assets for $RELEASE_TAG"
      - run:
          name: Remove signing material
          when: always
          shell: /bin/bash
          command: |
            set +e
            rm -f "$CIRCLE_WORKING_DIRECTORY/android/keystore.properties" "$CIRCLE_WORKING_DIRECTORY/.circleci-signing/zikr-release.keystore"

workflows:
  build-and-release:
    jobs:
      - ci-check
      - android-rebuild:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

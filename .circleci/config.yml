version: 2.1

# ZIKR execution is intentionally outside GitHub Actions.
# - ci-check runs on source changes.
# - android-rebuild runs only for release branches/tags.
# - background processing in CircleCI is opt-in and is a manual recovery path.
# - automatic video/social scheduling remains owned by GitHub Actions.
#
# IMPORTANT:
# CircleCI receives runtime values from CircleCI Project/Context environment
# variables. GitHub Environment secrets are NOT automatically inherited here.
# Never put secret values in this file.
parameters:
  run_circleci_ci:
    type: boolean
    default: false
  run_background_jobs:
    type: boolean
    default: false
  background_target:
    type: string
    default: all
  run_security_audit:
    type: boolean
    default: false

jobs:
  ci-check:
    docker:
      - image: cimg/node:22.11.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm config set network-concurrency 8
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Install video verification tools
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-core
            ffprobe -version | head -n 1
            rsvg-convert --version 2>&1 | head -n 1

      - run:
          name: Verify installed toolchain
          shell: /bin/bash
          command: |
            set -euo pipefail
            test -x node_modules/.bin/tsx || { echo "tsx was not installed correctly" >&2; exit 1; }
            node -e "import('@supabase/supabase-js').then(() => console.log('Supabase SDK dependency: OK'))"
      - run:
          name: Run the canonical verification suite
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm verify
          no_output_timeout: 30m

  supabase-production-gate:
    docker:
      - image: cimg/node:22.11.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate production Supabase runtime
          shell: /bin/bash
          command: |
            set -euo pipefail
            for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing required CircleCI production Supabase variable: $name"
                exit 1
              fi
            done
            node scripts/verify-supabase-production.mjs

  security-audit:
    docker:
      - image: cimg/node:22.11.0
    resource_class: small
    environment:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Production dependency audit
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm audit --prod --audit-level=high
      - run:
          name: Repository hygiene validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm hygiene:check
      - run:
          name: Authentication configuration validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm auth:check
      - run:
          name: Canonical URL configuration validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm canonical:check
      - run:
          name: Migration chain validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm supabase:migrations:check

  background-jobs:
    parameters:
      target:
        type: string
        default: all
    docker:
      - image: cimg/node:22.11.0
    resource_class: medium
    environment:
      BACKGROUND_JOB_TARGET: << parameters.target >>
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      VIDEO_BACKGROUND_BATCH_SIZE: "3"
      SOCIAL_BACKGROUND_BATCH_SIZE: "10"
      SOCIAL_PUBLISH_ENABLED: "false"
      VIDEO_GENERATOR: template
      AUTO_VIDEO_ENABLED: "true"
      AUTO_VIDEO_BATCH_SIZE: "1"
      AUTO_VIDEO_SECONDS: "14"
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Install FFmpeg and Arabic fonts
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-extra librsvg2-bin
            python3 -m venv .tts-venv
            .tts-venv/bin/pip install --quiet --no-cache-dir edge-tts==7.2.8
            echo 'export PATH="$CIRCLE_WORKING_DIRECTORY/.tts-venv/bin:$PATH"' >> "$BASH_ENV"
            ffmpeg -version | head -n 1
            fc-match "Noto Naskh Arabic"
      - run:
          name: Validate protected runtime configuration
          shell: /bin/bash
          command: |
            set -euo pipefail
            for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing required CircleCI secret/variable: $name"
                exit 1
              fi
            done
            if [[ "${SOCIAL_PUBLISH_ENABLED:-false}" == "true" ]]; then
              if [[ -z "${YOUTUBE_CLIENT_ID:-}" && -z "${FACEBOOK_PAGE_ID:-}" ]]; then
                echo "Social publishing is enabled but neither YouTube nor Facebook credentials are configured." >&2
                exit 1
              fi
            fi
      - run:
          name: Run background worker
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm background:jobs
          no_output_timeout: 30m


  android-rebuild:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    environment:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.jvmargs=-Xmx2048m
        -XX:MaxMetaspaceSize=512m
        -Dfile.encoding=UTF-8
    steps:
      - checkout
      - run:
          name: Validate Android release configuration
          shell: /bin/bash
          command: |
            set -euo pipefail
            REQUIRED_VARS=(
              NEXT_PUBLIC_SUPABASE_URL
              NEXT_PUBLIC_SUPABASE_ANON_KEY
              ANDROID_KEYSTORE_BASE64
              ANDROID_KEYSTORE_PASSWORD
              ANDROID_KEY_ALIAS
              ANDROID_KEY_PASSWORD
              GH_TOKEN
            )
            for name in "${REQUIRED_VARS[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required CircleCI Android release variable: ${name}" >&2
                exit 1
              fi
            done
            if [[ "$NEXT_PUBLIC_SUPABASE_URL" != "https://kdotmrjfecgafiommzwz.supabase.co" ]]; then
              echo "NEXT_PUBLIC_SUPABASE_URL does not match the canonical ZIKR Supabase project." >&2
              exit 1
            fi
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Select supported Java runtime
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            echo "export JAVA_HOME=$JAVA_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"
            java -version
      - run:
          name: Install Android SDK packages
          shell: /bin/bash
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Build web assets and sync Capacitor
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm build
            pnpm mobile:prepare
            pnpm exec cap sync android
          no_output_timeout: 20m
      - run:
          name: Restore and validate release keystore
          shell: /bin/bash
          command: |
            set -euo pipefail
            REQUIRED_VARS=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
            for name in "${REQUIRED_VARS[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing protected CircleCI environment variable: ${name}" >&2
                exit 1
              fi
            done
            SIGNING_DIR="$CIRCLE_WORKING_DIRECTORY/.circleci-signing"
            KEYSTORE_PATH="$SIGNING_DIR/zikr-release.keystore"
            PROPERTIES_PATH="$CIRCLE_WORKING_DIRECTORY/android/keystore.properties"
            mkdir -p "$SIGNING_DIR"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            STORE_TYPE="PKCS12"
            if keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              STORE_TYPE="PKCS12"
            elif keytool -list -storetype JKS -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              STORE_TYPE="JKS"
            else
              echo "Unable to open the release keystore with PKCS12 or JKS." >&2
              exit 1
            fi
            echo "Detected release keystore type: $STORE_TYPE"
            printf '%s\n' "storeFile=$KEYSTORE_PATH" "storeType=$STORE_TYPE" "storePassword=$ANDROID_KEYSTORE_PASSWORD" "keyAlias=$ANDROID_KEY_ALIAS" "keyPassword=$ANDROID_KEY_PASSWORD" > "$PROPERTIES_PATH"
            chmod 600 "$PROPERTIES_PATH"
      - run:
          name: Resolve Android release version
          shell: /bin/bash
          command: |
            set -euo pipefail
            VERSION_NAME="$(sed -n 's/.*versionName \"\([^\"]*\)\".*/\1/p' android/app/build.gradle | head -1)"
            if [[ -z "$VERSION_NAME" ]]; then
              echo "Unable to determine Android versionName" >&2
              exit 1
            fi
            if [[ "${CIRCLE_TAG:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              RELEASE_TAG="$CIRCLE_TAG"
            elif [[ "${CIRCLE_BRANCH:-}" =~ ^android-release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              RELEASE_TAG="v${BASH_REMATCH[1]}"
            else
              echo "Unable to determine Android release tag." >&2
              exit 1
            fi
            EXPECTED_VERSION="${RELEASE_TAG#v}"
            echo "Detected release tag: $RELEASE_TAG"
            echo "Detected Android versionName: $VERSION_NAME"
            if [[ "$VERSION_NAME" != "$EXPECTED_VERSION" ]]; then
              echo "Version mismatch detected." >&2
              exit 1
            fi
            echo "export ANDROID_RELEASE_TAG=$RELEASE_TAG" >> "$BASH_ENV"
      - run:
          name: Print Android build diagnostics
          shell: /bin/bash
          command: |
            set -euo pipefail
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
            java -version
            cd android
            ./gradlew --version
      - run:
          name: Clean Android build
          shell: /bin/bash
          command: |
            set -euo pipefail
            cd android
            ./gradlew clean --no-daemon --max-workers=1 --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          no_output_timeout: 20m
      - run:
          name: Build signed APK and AAB
          shell: /bin/bash
          command: |
            set -euo pipefail
            cd android
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=1 --stacktrace --warning-mode all -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          no_output_timeout: 40m
      - run:
          name: Verify APK, AAB, signature and version
          shell: /bin/bash
          command: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
            test -n "$APKSIGNER"
            test -n "$APKANALYZER"
            "$APKSIGNER" verify --verbose "$APK"
            jarsigner -verify "$AAB" >/tmp/aab-signature-check.txt 2>&1
            grep -E "jar verified" /tmp/aab-signature-check.txt
            "$APKANALYZER" manifest application-id "$APK" | grep -Fx 'com.zikr.app'
            "$APKANALYZER" manifest version-name "$APK" | grep -Fx "${ANDROID_RELEASE_TAG#v}"
            "$APKANALYZER" manifest target-sdk "$APK" | grep -Fx '36'
            sha256sum "$APK" "$AAB" > SHA256SUMS
            cat SHA256SUMS
      - run:
          name: Install GitHub CLI
          shell: /bin/bash
          command: |
            set -euo pipefail
            if command -v gh >/dev/null 2>&1; then
              gh --version
              exit 0
            fi
            sudo apt-get update
            sudo apt-get install -y curl
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y gh
            gh --version
      - run:
          name: Verify GitHub CLI authentication
          shell: /bin/bash
          command: |
            set -euo pipefail
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "GH_TOKEN is missing from CircleCI environment." >&2
              exit 1
            fi
            gh auth status
      - run:
          name: Publish Android release assets
          shell: /bin/bash
          command: |
            set -euo pipefail
            REPO="zikr-org/Zikr"
            RELEASE_TAG="$ANDROID_RELEASE_TAG"
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"

            if ! gh api "/repos/$REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Creating missing lightweight tag $RELEASE_TAG at $CIRCLE_SHA1 via GitHub API"
              gh api \
                --method POST \
                "/repos/$REPO/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" \
                -f "sha=$CIRCLE_SHA1"
            else
              echo "Tag $RELEASE_TAG already exists."
            fi

            if ! gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Creating fallback draft release because no admin-created draft was found."
              gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --draft --generate-notes --title "ZIKR $RELEASE_TAG"
            fi

            gh release upload "$RELEASE_TAG" "$APK" "$AAB" SHA256SUMS --repo "$REPO" --clobber

            assets="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | join("\n")')"
            echo "$assets"
            for asset in "$(basename "$APK")" "$(basename "$AAB")" "SHA256SUMS"; do
              echo "$assets" | grep -Fx "$asset" >/dev/null || {
                echo "Missing release asset: $asset" >&2
                exit 1
              }
            done

            gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false
            echo "Android release published successfully: $RELEASE_TAG"
      - run:
          name: Remove signing material
          when: always
          shell: /bin/bash
          command: |
            set +e
            rm -f "$CIRCLE_WORKING_DIRECTORY/android/keystore.properties"
            rm -f "$CIRCLE_WORKING_DIRECTORY/.circleci-signing/zikr-release.keystore"

workflows:
  build-and-release:
    when: << pipeline.parameters.run_circleci_ci >>
    jobs:
      - ci-check:
          filters:
            branches:
              only: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - supabase-production-gate:
          requires:
            - ci-check
          filters:
            branches:
              only: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - android-rebuild:
          requires:
            - ci-check
          filters:
            branches:
              only:
                - /^android-release-v[0-9]+\.[0-9]+\.[0-9]+$/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

  android-release-on-tag:
    jobs:
      - ci-check:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - android-rebuild:
          requires:
            - ci-check
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

  manual-background-processing:
    when: << pipeline.parameters.run_background_jobs >>
    jobs:
      - background-jobs:
          target: << pipeline.parameters.background_target >>

  manual-security-audit:
    when: << pipeline.parameters.run_security_audit >>
    jobs:
      - security-audit

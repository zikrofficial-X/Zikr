version: 2.1

jobs:
  ci-check:
    docker:
      - image: cimg/node:22.11.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm install --frozen-lockfile
      - run:
          name: Run the canonical verification suite
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm verify
          no_output_timeout: 30m

  android-rebuild:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    environment:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.jvmargs=-Xmx2048m
        -XX:MaxMetaspaceSize=512m
        -Dfile.encoding=UTF-8
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Select supported Java runtime
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            echo "export JAVA_HOME=$JAVA_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"
            java -version
      - run:
          name: Install Android SDK packages
          shell: /bin/bash
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm install --frozen-lockfile
      - run:
          name: Build web assets and sync Capacitor
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm build
            pnpm mobile:prepare
            pnpm exec cap sync android
          no_output_timeout: 20m
      - run:
          name: Restore and validate release keystore
          shell: /bin/bash
          command: |
            set -euo pipefail
            REQUIRED_VARS=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
            for name in "${REQUIRED_VARS[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing protected CircleCI environment variable: ${name}" >&2
                exit 1
              fi
            done
            SIGNING_DIR="$CIRCLE_WORKING_DIRECTORY/.circleci-signing"
            KEYSTORE_PATH="$SIGNING_DIR/zikr-release.keystore"
            PROPERTIES_PATH="$CIRCLE_WORKING_DIRECTORY/android/keystore.properties"
            mkdir -p "$SIGNING_DIR"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            STORE_TYPE="PKCS12"
            if keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              STORE_TYPE="PKCS12"
            elif keytool -list -storetype JKS -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              STORE_TYPE="JKS"
            else
              echo "Unable to open the release keystore with PKCS12 or JKS." >&2
              exit 1
            fi
            echo "Detected release keystore type: $STORE_TYPE"
            printf '%s\n' "storeFile=$KEYSTORE_PATH" "storeType=$STORE_TYPE" "storePassword=$ANDROID_KEYSTORE_PASSWORD" "keyAlias=$ANDROID_KEY_ALIAS" "keyPassword=$ANDROID_KEY_PASSWORD" > "$PROPERTIES_PATH"
            chmod 600 "$PROPERTIES_PATH"
      - run:
          name: Resolve Android release version
          shell: /bin/bash
          command: |
            set -euo pipefail
            VERSION_NAME="$(sed -n 's/.*versionName \"\([^\"]*\)\".*/\1/p' android/app/build.gradle | head -1)"
            if [[ -z "$VERSION_NAME" ]]; then
              echo "Unable to determine Android versionName" >&2
              exit 1
            fi
            if [[ "${CIRCLE_TAG:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              RELEASE_TAG="$CIRCLE_TAG"
            elif [[ "${CIRCLE_BRANCH:-}" =~ ^android-release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              RELEASE_TAG="v${BASH_REMATCH[1]}"
            else
              echo "Unable to determine Android release tag." >&2
              exit 1
            fi
            EXPECTED_VERSION="${RELEASE_TAG#v}"
            echo "Detected release tag: $RELEASE_TAG"
            echo "Detected Android versionName: $VERSION_NAME"
            if [[ "$VERSION_NAME" != "$EXPECTED_VERSION" ]]; then
              echo "Version mismatch detected." >&2
              exit 1
            fi
            echo "export ANDROID_RELEASE_TAG=$RELEASE_TAG" >> "$BASH_ENV"
      - run:
          name: Print Android build diagnostics
          shell: /bin/bash
          command: |
            set -euo pipefail
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
            java -version
            cd android
            ./gradlew --version
      - run:
          name: Clean Android build
          shell: /bin/bash
          command: |
            set -euo pipefail
            cd android
            ./gradlew clean --no-daemon --max-workers=1 --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          no_output_timeout: 20m
      - run:
          name: Build signed APK and AAB
          shell: /bin/bash
          command: |
            set -euo pipefail
            cd android
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=1 --stacktrace --warning-mode all -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          no_output_timeout: 40m
      - run:
          name: Verify APK, AAB, signature and version
          shell: /bin/bash
          command: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
            test -n "$APKSIGNER"
            test -n "$APKANALYZER"
            "$APKSIGNER" verify --verbose "$APK"
            "$APKANALYZER" manifest application-id "$APK" | grep -Fx 'com.zikr.app'
            "$APKANALYZER" manifest version-name "$APK" | grep -Fx "${ANDROID_RELEASE_TAG#v}"
            "$APKANALYZER" manifest target-sdk "$APK" | grep -Fx '36'
            sha256sum "$APK" "$AAB" > SHA256SUMS
            cat SHA256SUMS
      - run:
          name: Install GitHub CLI
          shell: /bin/bash
          command: |
            set -euo pipefail
            if command -v gh >/dev/null 2>&1; then
              gh --version
              exit 0
            fi
            sudo apt-get update
            sudo apt-get install -y curl
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y gh
            gh --version
      - run:
          name: Verify GitHub CLI authentication
          shell: /bin/bash
          command: |
            set -euo pipefail
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "GH_TOKEN is missing from CircleCI environment." >&2
              exit 1
            fi
            gh auth status
      - run:
          name: Publish Android release assets
          shell: /bin/bash
          command: |
            set -euo pipefail
            REPO="Zikrmediaofficial/Zikr"
            RELEASE_TAG="$ANDROID_RELEASE_TAG"
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            if ! gh api "/repos/$REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Creating missing lightweight tag $RELEASE_TAG at $CIRCLE_SHA1 via GitHub API"
              gh api \
                --method POST \
                "/repos/$REPO/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" \
                -f "sha=$CIRCLE_SHA1"
            else
              echo "Tag $RELEASE_TAG already exists."
            fi
            if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$APK" "$AAB" SHA256SUMS --repo "$REPO" --clobber
            else
              gh release create "$RELEASE_TAG" "$APK" "$AAB" SHA256SUMS --repo "$REPO" --verify-tag --generate-notes --title "ZIKR $RELEASE_TAG"
            fi
            echo "Android release published successfully: $RELEASE_TAG"
      - run:
          name: Remove signing material
          when: always
          shell: /bin/bash
          command: |
            set +e
            rm -f "$CIRCLE_WORKING_DIRECTORY/android/keystore.properties"
            rm -f "$CIRCLE_WORKING_DIRECTORY/.circleci-signing/zikr-release.keystore"

workflows:
  build-and-release:
    jobs:
      - ci-check:
          filters:
            branches:
              only: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - android-rebuild:
          requires:
            - ci-check
          filters:
            branches:
              only:
                - /^android-release-v[0-9]+\.[0-9]+\.[0-9]+$/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

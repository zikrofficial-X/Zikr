version: 2.1

# ZIKR CI ownership:
# - GitHub Actions owns PR/main source verification, recurring video generation, social publishing, and controlled Vercel release.
# - CircleCI owns the application build/documentation artifact, Android release builds, Supabase release gates, and English-content sync.
# - CircleCI does NOT execute the production video or social worker.
#
# IMPORTANT:
# CircleCI receives runtime values from CircleCI Project/Context environment
# variables. GitHub Environment secrets are NOT automatically inherited here.
# Never put secret values in this file.
parameters:
  run_circleci_ci:
    type: boolean
    default: true
  run_security_audit:
    type: boolean
    default: false

jobs:
  source-verify:
    docker:
      - image: cimg/node:22.11.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm config set network-concurrency 8
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Verify installed toolchain
          shell: /bin/bash
          command: |
            set -euo pipefail
            test -x node_modules/.bin/tsx || { echo "tsx was not installed correctly" >&2; exit 1; }
            node -e "import('@supabase/supabase-js').then(() => console.log('Supabase SDK dependency: OK'))"
      - run:
          name: Run the canonical verification suite
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm verify:pr
          no_output_timeout: 20m

  application-build-docs:
    docker:
      - image: cimg/node:22.11.0
    resource_class: medium
    environment:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://wvetcauyerlkqvmntajq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2ZXRjYXV5ZXJsa3F2bW50YWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTg1ODIsImV4cCI6MjEwNjk5NDU4Mn0.ZqrApyq4rujN4xZHVBNHjvLBHIzubEQpKGmp7hiCdV8
      AUTH_CALLBACK_URL: https://zikrmediaofficial.vercel.app/auth/callback
    steps:
      - checkout
      - run:
          name: Validate application build environment
          shell: /bin/bash
          command: |
            set -euo pipefail
            test -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL." >&2; exit 1; }
            test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" || { echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY." >&2; exit 1; }
            test -n "${NEXT_PUBLIC_SITE_URL:-}" || { echo "Missing NEXT_PUBLIC_SITE_URL." >&2; exit 1; }
            test -n "${AUTH_CALLBACK_URL:-}" || { echo "Missing AUTH_CALLBACK_URL." >&2; exit 1; }
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Install application dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm config set network-concurrency 8
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Produce production web application
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm build
          no_output_timeout: 25m
      - run:
          name: Generate build and release documentation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm ci:build:report
            tar -czf "ci-artifacts/zikr-next-build-${CIRCLE_SHA1}.tgz" .next
            printf '%s\n' "ZIKR production web build artifact: ci-artifacts/zikr-next-build-${CIRCLE_SHA1}.tgz"
      - store_artifacts:
          path: ci-artifacts
          destination: application-build

  supabase-production-gate:
    docker:
      - image: cimg/node:22.11.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate production Supabase runtime
          shell: /bin/bash
          command: |
            set -euo pipefail
            for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing required CircleCI production Supabase variable: $name"
                exit 1
              fi
            done
            node scripts/verify-supabase-production.mjs

  security-audit:
    docker:
      - image: cimg/node:22.11.0
    resource_class: medium
    environment:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm config set network-concurrency 8
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Production dependency audit
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm audit --prod --audit-level=high
      - run:
          name: Repository hygiene validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm hygiene:check
      - run:
          name: Authentication configuration validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm auth:check
      - run:
          name: Canonical URL configuration validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm canonical:check
      - run:
          name: Migration chain validation
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm supabase:migrations:check

  english-content-sync:
    docker:
      - image: cimg/node:22.11.0
    resource_class: small
    environment:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      TRANSLATION_BATCH_SIZE: "5"
      HADITH_TRANSLATION_BATCH_SIZE: "25"
    steps:
      - checkout
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Validate production content-sync credentials
          shell: /bin/bash
          command: |
            set -euo pipefail
            test -n "${SUPABASE_URL:-}" || { echo "Missing SUPABASE_URL."; exit 1; }
            test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY."; exit 1; }
            test -n "${GEMINI_API_KEY:-}" || { echo "Missing GEMINI_API_KEY."; exit 1; }
      - run:
          name: Run bounded English content sync
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm translate:articles:en
            pnpm sync:hadith:en
          no_output_timeout: 20m

  android-rebuild:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    environment:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://wvetcauyerlkqvmntajq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2ZXRjYXV5ZXJsa3F2bW50YWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTg1ODIsImV4cCI6MjEwNjk5NDU4Mn0.ZqrApyq4rujN4xZHVBNHjvLBHIzubEQpKGmp7hiCdV8
      SUPABASE_URL: https://wvetcauyerlkqvmntajq.supabase.co
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.jvmargs=-Xmx2048m
        -XX:MaxMetaspaceSize=512m
        -Dfile.encoding=UTF-8
    steps:
      - checkout
      - run:
          name: Validate Android release configuration
          shell: /bin/bash
          command: |
            set -euo pipefail
            REQUIRED_VARS=(
              NEXT_PUBLIC_SUPABASE_URL
              NEXT_PUBLIC_SUPABASE_ANON_KEY
              SUPABASE_URL
              SUPABASE_SERVICE_ROLE_KEY
              ANDROID_KEYSTORE_BASE64
              ANDROID_KEYSTORE_PASSWORD
              ANDROID_KEY_ALIAS
              ANDROID_KEY_PASSWORD
            )
            for name in "${REQUIRED_VARS[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required CircleCI Android release variable: ${name}" >&2
                exit 1
              fi
            done
            if [[ "$NEXT_PUBLIC_SUPABASE_URL" != "https://wvetcauyerlkqvmntajq.supabase.co" ]]; then
              echo "NEXT_PUBLIC_SUPABASE_URL does not match the canonical ZIKR Supabase project." >&2
              exit 1
            fi
      - run:
          name: Enable pnpm
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@9.15.0 --activate
            node --version
            pnpm --version
      - run:
          name: Select supported Java runtime
          shell: /bin/bash
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            echo "export JAVA_HOME=$JAVA_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"
            java -version
      - run:
          name: Install Android SDK packages
          shell: /bin/bash
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - run:
          name: Install dependencies
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm config set fetch-retries 5
            pnpm config set fetch-timeout 120000
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          no_output_timeout: 20m
      - run:
          name: Build web assets and sync Capacitor
          shell: /bin/bash
          command: |
            set -euo pipefail
            pnpm build
            pnpm mobile:prepare
            pnpm exec cap sync android
          no_output_timeout: 20m
      - run:
          name: Restore and validate release keystore
          shell: /bin/bash
          command: |
            set -euo pipefail
            REQUIRED_VARS=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
            for name in "${REQUIRED_VARS[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing protected CircleCI environment variable: ${name}" >&2
                exit 1
              fi
            done
            SIGNING_DIR="$CIRCLE_WORKING_DIRECTORY/.circleci-signing"
            KEYSTORE_PATH="$SIGNING_DIR/zikr-release.keystore"
            PROPERTIES_PATH="$CIRCLE_WORKING_DIRECTORY/android/keystore.properties"
            mkdir -p "$SIGNING_DIR"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            STORE_TYPE="PKCS12"
            if keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              STORE_TYPE="PKCS12"
            elif keytool -list -storetype JKS -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              STORE_TYPE="JKS"
            else
              echo "Unable to open the release keystore with PKCS12 or JKS." >&2
              exit 1
            fi
            echo "Detected release keystore type: $STORE_TYPE"
            printf '%s\n' "storeFile=$KEYSTORE_PATH" "storeType=$STORE_TYPE" "storePassword=$ANDROID_KEYSTORE_PASSWORD" "keyAlias=$ANDROID_KEY_ALIAS" "keyPassword=$ANDROID_KEY_PASSWORD" > "$PROPERTIES_PATH"
            chmod 600 "$PROPERTIES_PATH"
      - run:
          name: Resolve Android release version
          shell: /bin/bash
          command: |
            set -euo pipefail
            VERSION_NAME="$(sed -n 's/.*versionName \"\([^\"]*\)\".*/\1/p' android/app/build.gradle | head -1)"
            if [[ -z "$VERSION_NAME" ]]; then
              echo "Unable to determine Android versionName" >&2
              exit 1
            fi
            if [[ "${CIRCLE_TAG:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              RELEASE_TAG="$CIRCLE_TAG"
            elif [[ "${CIRCLE_BRANCH:-}" =~ ^android-release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              RELEASE_TAG="v${BASH_REMATCH[1]}"
            else
              echo "Unable to determine Android release tag." >&2
              exit 1
            fi
            EXPECTED_VERSION="${RELEASE_TAG#v}"
            echo "Detected release tag: $RELEASE_TAG"
            echo "Detected Android versionName: $VERSION_NAME"
            if [[ "$VERSION_NAME" != "$EXPECTED_VERSION" ]]; then
              echo "Version mismatch detected." >&2
              exit 1
            fi
            echo "export ANDROID_RELEASE_TAG=$RELEASE_TAG" >> "$BASH_ENV"
      - run:
          name: Print Android build diagnostics
          shell: /bin/bash
          command: |
            set -euo pipefail
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
            java -version
            cd android
            ./gradlew --version
      - run:
          name: Clean Android build
          shell: /bin/bash
          command: |
            set -euo pipefail
            cd android
            ./gradlew clean --no-daemon --max-workers=1 --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          no_output_timeout: 20m
      - run:
          name: Build signed APK and AAB
          shell: /bin/bash
          command: |
            set -euo pipefail
            cd android
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=1 --stacktrace --warning-mode all -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          no_output_timeout: 40m
      - run:
          name: Verify APK, AAB, signature and version
          shell: /bin/bash
          command: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
            test -n "$APKSIGNER"
            test -n "$APKANALYZER"
            "$APKSIGNER" verify --verbose "$APK"
            if ! jarsigner -verify "$AAB" >/tmp/aab-signature-check.txt 2>&1; then
              cat /tmp/aab-signature-check.txt
              echo "AAB JAR signature verification failed." >&2
              exit 1
            fi
            cat /tmp/aab-signature-check.txt
            "$APKANALYZER" manifest application-id "$APK" | grep -Fx 'com.zikr.app'
            "$APKANALYZER" manifest version-name "$APK" | grep -Fx "${ANDROID_RELEASE_TAG#v}"
            "$APKANALYZER" manifest target-sdk "$APK" | grep -Fx '36'
            sha256sum "$APK" "$AAB" > SHA256SUMS
            cat SHA256SUMS
      - run:
          name: Upload verified Android assets to Supabase Storage
          shell: /bin/bash
          command: |
            set -euo pipefail
            RELEASE_TAG="$ANDROID_RELEASE_TAG"
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            SHA_FILE="SHA256SUMS"

            SUPABASE_URL="${SUPABASE_URL%/}"
            BUCKET="android-releases"
            BASE_PATH="android/${RELEASE_TAG}"
            STORAGE_API="${SUPABASE_URL}/storage/v1/object"
            PUBLIC_BASE="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${BASE_PATH}"

            upload_object() {
              local file_path="$1"
              local object_path="$2"
              local mime_type="$3"
              curl --fail --silent --show-error --location \
                --request POST "${STORAGE_API}/${BUCKET}/${object_path}" \
                --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "x-upsert: true" \
                --header "Content-Type: ${mime_type}" \
                --data-binary "@${file_path}" >/dev/null
            }

            APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
            AAB_SHA="$(sha256sum "$AAB" | awk '{print $1}')"
            VERSION_NAME="$(sed -n 's/.*versionName \"\([^\"]*\)\".*/\1/p' android/app/build.gradle | head -1)"
            APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -1)"
            if [[ -z "$APKANALYZER" ]]; then
              echo "Android SDK apkanalyzer is required to publish verifiable release metadata." >&2
              exit 1
            fi
            VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
            EXPECTED_VERSION_CODE="$(awk '/^[[:space:]]*versionCode[[:space:]]+/ {print $2; exit}' android/app/build.gradle)"
            test -n "$EXPECTED_VERSION_CODE" || { echo "Unable to read Gradle versionCode." >&2; exit 1; }
            test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE" || {
              echo "APK versionCode ($VERSION_CODE) does not match Gradle ($EXPECTED_VERSION_CODE)." >&2
              exit 1
            }

            upload_object "$APK" "${BASE_PATH}/app-release.apk" "application/vnd.android.package-archive"
            upload_object "$AAB" "${BASE_PATH}/app-release.aab" "application/octet-stream"
            upload_object "$SHA_FILE" "${BASE_PATH}/SHA256SUMS" "text/plain"

            cat > /tmp/release-metadata.json \<<EOF
            {
              "tag": "${RELEASE_TAG}",
              "version": "${VERSION_NAME}",
              "versionCode": ${VERSION_CODE},
              "applicationId": "com.zikr.app",
              "targetSdk": 36,
              "sourceCommit": "${CIRCLE_SHA1}",
              "apkSha256": "${APK_SHA}",
              "aabSha256": "${AAB_SHA}",
              "apkUrl": "${PUBLIC_BASE}/app-release.apk",
              "aabUrl": "${PUBLIC_BASE}/app-release.aab",
              "sha256Url": "${PUBLIC_BASE}/SHA256SUMS"
            }
            EOF

            upload_object /tmp/release-metadata.json "${BASE_PATH}/release-metadata.json" "application/json"

            curl --fail --silent --show-error --location "${PUBLIC_BASE}/app-release.apk" -o /tmp/verified-app-release.apk
            curl --fail --silent --show-error --location "${PUBLIC_BASE}/app-release.aab" -o /tmp/verified-app-release.aab
            test "$(sha256sum /tmp/verified-app-release.apk | awk '{print $1}')" = "${APK_SHA}"
            test "$(sha256sum /tmp/verified-app-release.aab | awk '{print $1}')" = "${AAB_SHA}"

            cat > /tmp/site-setting.json \<<EOF
            {
              "key": "android_release",
              "value": {
                "mode": "github-supabase",
                "status": "assets_ready",
                "releaseTag": "${RELEASE_TAG}",
                "version": "${VERSION_NAME}",
                "versionCode": ${VERSION_CODE},
                "applicationId": "com.zikr.app",
                "targetSdk": 36,
                "sourceCommit": "${CIRCLE_SHA1}",
                "releaseUrl": "https://github.com/zikrcontact-del/Zikr/releases/tag/${RELEASE_TAG}",
                "apkUrl": "${PUBLIC_BASE}/app-release.apk",
                "aabUrl": "${PUBLIC_BASE}/app-release.aab",
                "sha256Url": "${PUBLIC_BASE}/SHA256SUMS",
                "metadataUrl": "${PUBLIC_BASE}/release-metadata.json",
                "apkSha256": "${APK_SHA}",
                "aabSha256": "${AAB_SHA}"
              }
            }
            EOF

            curl --fail --silent --show-error --location \
              --request PATCH "${SUPABASE_URL}/rest/v1/site_settings?key=eq.android_release" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data-binary @/tmp/site-setting.json >/dev/null

            echo "Supabase Android release assets uploaded and checksum-verified."
      - run:
          name: Remove signing material
          when: always
          shell: /bin/bash
          command: |
            set +e
            rm -f "$CIRCLE_WORKING_DIRECTORY/android/keystore.properties"
            rm -f "$CIRCLE_WORKING_DIRECTORY/.circleci-signing/zikr-release.keystore"

workflows:
  build-and-release:
    when: << pipeline.parameters.run_circleci_ci >>
    jobs:
      - source-verify:
          filters:
            branches:
              only:
                - /^android-release-v[0-9]+\.[0-9]+\.[0-9]+$/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - application-build-docs:
          filters:
            branches:
              only:
                - main
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - supabase-production-gate:
          requires:
            - source-verify
          filters:
            branches:
              only:
                - /^android-release-v[0-9]+\.[0-9]+\.[0-9]+$/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - android-rebuild:
          requires:
            - source-verify
          filters:
            branches:
              only:
                - /^android-release-v[0-9]+\.[0-9]+\.[0-9]+$/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

  manual-security-audit:
    when: << pipeline.parameters.run_security_audit >>
    jobs:
      - security-audit

  scheduled-english-content-sync:
    triggers:
      - schedule:
          cron: "17 4 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - english-content-sync



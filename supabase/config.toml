project_id = "eydxvcamhjhajxjrsgym"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://zikrmediaofficial.vercel.app"
# The public production origin is fixed. Keep app redirect URLs explicit for Supabase Auth.
additional_redirect_urls = [
  "https://zikrmediaofficial.vercel.app/auth/callback",
  "https://eydxvcamhjhajxjrsgym.supabase.co/auth/v1/callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

# Avatars bucket — public read, authenticated write, per-user path scoping
[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/gif"]

# Media bucket — articles, stories, and other editorial media
[storage.buckets.media]
public = true
file_size_limit = "20MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "video/mp4"]

# Audio bucket — Quran recitations and tawasheeh clips (private, presigned URLs)
[storage.buckets.audio]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["audio/mpeg", "audio/mp4", "audio/ogg", "audio/wav"]

# Documents bucket — PDFs and downloadable resources
[storage.buckets.documents]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf"]

[functions.health]
verify_jwt = false

[functions.spiritual-ai]
verify_jwt = true

[functions.prayer-notification-worker]
# pg_cron authenticates this worker with a private database-backed bearer token.
verify_jwt = false

[functions.source-verified-content-agent]
# pg_cron authenticates this function with the private scheduler secret RPC.
verify_jwt = false

name: Publish Android Release Assets

on:
  push:
    tags:
      - 'v*.*.*'
    # Recovery branches are published through the explicit workflow_dispatch
    # retry path below. GitHub Actions combines simultaneous tag/branch filters,
    # which silently prevents the branch recovery event from starting.
  workflow_dispatch:
    inputs:
      retry:
        description: "Retry the current release after CircleCI/Supabase artifacts are ready"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: write
  statuses: read

concurrency:
  group: android-release-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish Android release
    if: >-
      github.ref_type == 'tag' ||
      (github.ref_type == 'branch' && startsWith(github.ref_name, 'android-release-v')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.retry == true &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_PUBLIC_ROOT: https://ymxdswkaxafakugktsim.supabase.co/storage/v1/object/public/android-releases/android
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v7

      - name: Decide whether this is a release publish run
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PUBLISH=true
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" =~ ^android-release-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PUBLISH=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.retry }}" == "true" && -f docs/finalization/RELEASE_RETRY.flag ]]; then
            PUBLISH=true
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" =~ ^android-release-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="${GITHUB_REF_NAME#android-release-}"
          else
            TAG="$(tr -d '\r\n' < .release-tag)"
          fi
          # The release branch and canonical package/tag metadata must agree.
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            test "${TAG}" = "$(tr -d '\r\n' < .release-tag)"
          fi
          EXPECTED_TAG="v$(jq -r '.version' package.json)"
          test "$TAG" = "$EXPECTED_TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLIC_BASE=${SUPABASE_PUBLIC_ROOT}/${TAG}" >> "$GITHUB_ENV"

      - name: Verify CircleCI Android build status before waiting for artifacts
        if: steps.gate.outputs.publish == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # CircleCI is the signing authority. Do not wait for artifacts when its
          # matching android-rebuild status has already failed.
          for attempt in $(seq 1 240); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
              --jq '.statuses | map(select(.context == "ci/circleci: android-rebuild")) | sort_by(.updated_at) | (last // {}) | .state // ""' 2>/dev/null || true)"
            case "${status}" in
              success)
                echo "CircleCI Android build succeeded for ${GITHUB_SHA}."
                exit 0
                ;;
              failure|error)
                echo "::error title=CircleCI Android build failed::The protected APK/AAB build failed for commit ${GITHUB_SHA}. Check the CircleCI android-rebuild job before retrying publication."
                exit 1
                ;;
              pending|"")
                echo "Waiting for CircleCI Android build status (attempt ${attempt}/240)..."
                ;;
              *)
                echo "Unknown CircleCI status '${status}' (attempt ${attempt}/80); refusing to publish without success."
                ;;
            esac
            sleep 15
          done
          echo "::error title=CircleCI Android build status unavailable::No successful CircleCI android-rebuild status was observed for ${GITHUB_SHA} within 60 minutes."
          exit 1

      - name: Install Android SDK
        if: steps.gate.outputs.publish == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Java 21
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Wait for Supabase Android artifacts
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if curl -fsSL "$SUPABASE_PUBLIC_BASE/release-metadata.json" -o release-metadata.json \
              && curl -fsSL "$SUPABASE_PUBLIC_BASE/app-release.apk" -o app-release.apk \
              && curl -fsSL "$SUPABASE_PUBLIC_BASE/app-release.aab" -o app-release.aab \
              && curl -fsSL "$SUPABASE_PUBLIC_BASE/SHA256SUMS" -o SHA256SUMS; then
              echo "Android artifacts are available."
              exit 0
            fi
            echo "Waiting for CircleCI/Supabase artifacts (attempt $attempt/120; up to 60 minutes)..."
            rm -f release-metadata.json app-release.apk app-release.aab SHA256SUMS
            sleep 30
          done
          echo "Timed out waiting for Supabase Android artifacts after 60 minutes." >&2
          exit 1

      - name: Verify release metadata
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${TAG}"
          VERSION="${TAG#v}"
          test "$(jq -r .tag release-metadata.json)" = "$TAG"
          test "$(jq -r .version release-metadata.json)" = "$VERSION"
          test "$(jq -r .applicationId release-metadata.json)" = "com.zikr.app"
          test "$(jq -r .targetSdk release-metadata.json)" = "36"
          grep -F "${TAG}" .release-tag
          SOURCE_COMMIT="$(jq -r '.sourceCommit // empty' release-metadata.json)"
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Android artifact provenance::Release metadata is missing a valid source commit." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            source_status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_COMMIT}/status" --jq '.statuses | map(select(.context == "ci/circleci: android-rebuild")) | sort_by(.updated_at) | (last // {}) | .state // ""' 2>/dev/null || true)"
            if [[ "${source_status}" != "success" ]]; then
              echo "::error title=Unverified Android artifact source::The metadata source commit has no successful CircleCI android-rebuild status." >&2
              exit 1
            fi
          else
            test "${SOURCE_COMMIT}" = "${GITHUB_SHA}" || {
              echo "::error title=Stale Android release artifacts::Artifact source commit does not match the exact release ref commit." >&2
              exit 1
            }
          fi

      - name: Verify checksums
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          MAX_STORAGE_OBJECT_BYTES=52428800
          for artifact in app-release.apk app-release.aab; do
            size_bytes="$(stat -c '%s' "$artifact")"
            if (( size_bytes > MAX_STORAGE_OBJECT_BYTES )); then
              echo "::error title=Artifact exceeds Supabase Free-tier limit::$artifact is larger than 50 MiB ($size_bytes bytes)." >&2
              exit 1
            fi
          done
          APK_SHA="$(awk 'NR == 1 {print $1}' SHA256SUMS)"
          AAB_SHA="$(awk 'NR == 2 {print $1}' SHA256SUMS)"
          test -n "$APK_SHA"
          test -n "$AAB_SHA"
          test "$APK_SHA" = "$(sha256sum app-release.apk | awk '{print $1}')"
          test "$AAB_SHA" = "$(sha256sum app-release.aab | awk '{print $1}')"
          test "$(jq -r .apkSha256 release-metadata.json)" = "$APK_SHA"
          test "$(jq -r .aabSha256 release-metadata.json)" = "$AAB_SHA"

      - name: Verify APK signature and manifest
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -n "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose app-release.apk
          BADGING="$("$AAPT" dump badging app-release.apk)"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='com.zikr.app'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='${TAG#v}'"
          printf '%s\n' "$BADGING" | grep -Fx "targetSdkVersion:'36'"

      - name: Verify signed AAB
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify app-release.aab

      - name: Verify GitHub Release state before publishing assets
        id: release_state
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON=""
          for attempt in $(seq 1 30); do
            if RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
              break
            fi
            echo "Waiting for GitHub release (attempt $attempt/30)..."
            sleep 5
          done
          if [[ -z "$RELEASE_JSON" ]]; then
            echo "GitHub release not found for $TAG. Create its draft before publishing signed APK/AAB assets." >&2
            exit 1
          fi

          IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_JSON")"
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "upload_allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Published releases are immutable. Never try to clobber an immutable
          # release: only accept a repeat run when the existing public files are
          # exactly the same as the verified build downloaded in this job.
          REQUIRED_ASSETS=(app-release.apk app-release.aab SHA256SUMS release-metadata.json)
          ASSET_NAMES="$(jq -r '.assets[].name' <<< "$RELEASE_JSON")"
          MISSING=()
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if ! grep -Fxq "$asset" <<< "$ASSET_NAMES"; then
              MISSING+=("$asset")
            fi
          done
          if (("${#MISSING[@]}" > 0)); then
            echo "::error title=Published immutable release is missing Android assets::Release $TAG is already published and immutable, and is missing: ${MISSING[*]}. It cannot be repaired in place; create the next semantic Android release and publish it only after the signed APK/AAB are verified." >&2
            exit 1
          fi

          EXISTING_DIR="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$EXISTING_DIR"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$EXISTING_DIR"; then
            echo "::error title=Cannot verify immutable release assets::Unable to download the existing public assets for $TAG." >&2
            exit 1
          fi
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [[ ! -s "$EXISTING_DIR/$asset" ]] || ! cmp -s "$asset" "$EXISTING_DIR/$asset"; then
              echo "::error title=Immutable release asset mismatch::$asset in published release $TAG does not match the verified build. Create the next semantic Android release; do not overwrite a published release." >&2
              exit 1
            fi
          done
          echo "Published release $TAG already contains the exact verified assets."
          echo "upload_allowed=false" >> "$GITHUB_OUTPUT"

      - name: Upload release assets and publish
        if: steps.gate.outputs.publish == 'true' && steps.release_state.outputs.upload_allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Replace assets atomically from the checksum-verified build so reruns
          # cannot silently retain binaries from an older build of the same tag.
          for asset in app-release.apk app-release.aab SHA256SUMS release-metadata.json; do
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          done

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --latest=true
          echo "Published Android release $TAG."

      - name: Verify published GitHub Release contains the exact signed assets
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          if [[ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" != "false" ]]; then
            echo "::error title=GitHub Release is still a draft::The Android release was not published after asset verification." >&2
            exit 1
          fi

          REQUIRED_ASSETS=(app-release.apk app-release.aab SHA256SUMS release-metadata.json)
          for asset in "${REQUIRED_ASSETS[@]}"; do
            size="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .size' <<< "$RELEASE_JSON" | head -n 1)"
            if [[ ! "$size" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=GitHub Release is missing an asset::$asset is absent or empty on the published GitHub Release." >&2
              exit 1
            fi
          done

          VERIFY_DIR="$RUNNER_TEMP/published-release-assets"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$VERIFY_DIR"
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [[ ! -s "$VERIFY_DIR/$asset" ]] || ! cmp -s "$asset" "$VERIFY_DIR/$asset"; then
              echo "::error title=GitHub Release asset verification failed::$asset on GitHub does not match the verified build file." >&2
              exit 1
            fi
          done
          echo "GitHub Release $TAG contains non-empty APK, AAB, SHA256SUMS, and metadata matching the verified build."

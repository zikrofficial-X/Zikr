name: Background Jobs

# Canonical production worker for deterministic video rendering and social publishing.
# Vercel remains a protected compatibility endpoint; this workflow owns the background queues.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Queue to process"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - videos
          - social
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: zikr-background-jobs-production
  cancel-in-progress: false

env:
  VIDEO_GENERATOR: template
  SOCIAL_PUBLISH_ENABLED: ${{ vars.ZIKR_SOCIAL_PUBLISH_ENABLED || 'true' }}

jobs:
  process:
    name: Process background queues
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://eydxvcamhjhajxjrsgym.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v26.0' }}
      VIDEO_AUTO_PUBLISH: ${{ vars.ZIKR_VIDEO_AUTO_PUBLISH || 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install FFmpeg and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-extra
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate worker configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions configuration: ${name}" >&2
              missing=1
            fi
          done
          if [[ "${SOCIAL_PUBLISH_ENABLED:-true}" == "true" ]]; then
            if [[ -z "${YOUTUBE_CLIENT_ID:-}" || -z "${YOUTUBE_CLIENT_SECRET:-}" || -z "${YOUTUBE_REFRESH_TOKEN:-}" ]]; then
              echo "WARNING: YouTube OAuth is not fully configured; YouTube publishing will be skipped and reported by the worker."
            fi
            if [[ -z "${FACEBOOK_PAGE_ID:-}" || -z "${FACEBOOK_PAGE_ACCESS_TOKEN:-}" ]]; then
              echo "WARNING: Facebook publishing is not fully configured; Facebook publishing will be skipped and reported by the worker."
            fi
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Resolve queue target
        id: target
        shell: bash
        env:
          DISPATCH_TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "target=${DISPATCH_TARGET:-all}" >> "$GITHUB_OUTPUT"
          else
            echo "target=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run background queues
        env:
          BACKGROUND_JOB_TARGET: ${{ steps.target.outputs.target }}
        run: pnpm background:jobs

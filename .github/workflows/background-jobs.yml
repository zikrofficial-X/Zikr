name: Background Jobs

# Free, deterministic background video pipeline. HeyGen is not required for
# the production template generator; optional provider credentials remain
# available for explicit provider-specific workflows.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Queue to process"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - videos
          - social

permissions:
  contents: read

concurrency:
  group: zikr-background-jobs-production
  cancel-in-progress: false

env:
  VIDEO_GENERATOR: template
  # Facebook credentials in the current queue are expired. Keep social
  # publishing opt-in so video generation remains green until tokens are
  # refreshed. Set to "true" only after valid social credentials are stored.
  SOCIAL_PUBLISH_ENABLED: "false"

jobs:
  process:
    name: Process background queues
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Public/non-secret defaults are safe to provide here and prevent a
      # false failure when the same values are only stored in Vercel.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://eydxvcamhjhajxjrsgym.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://zikrmediaofficial.vercel.app' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install FFmpeg and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-extra
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the missing secret(s) under GitHub Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Resolve queue target
        id: target
        shell: bash
        run: |
          echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"

      - name: Run background queues
        env:
          BACKGROUND_JOB_TARGET: ${{ steps.target.outputs.target }}
        run: pnpm background:jobs

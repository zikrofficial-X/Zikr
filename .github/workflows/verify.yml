name: ZIKR verify

# GitHub-hosted runners are unavailable for this account without billing access.
# Verification is performed automatically by CircleCI and Vercel.
# Keep this workflow manual-only so it never triggers a runner/billing failure.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full verification
        run: pnpm verify

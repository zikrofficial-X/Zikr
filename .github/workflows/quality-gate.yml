name: ZIKR Quality Gate
# Canonical source-gate check: ZIKR / Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "ZIKR / Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm config set fetch-retries 5
          pnpm config set fetch-timeout 120000
          pnpm config set fetch-retry-mintimeout 20000
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm config set network-concurrency 8
          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
        timeout-minutes: 15

      - name: Run canonical source and architecture gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "Running the full main-branch verification suite."
            pnpm verify
          else
            echo "Running the pull-request verification suite."
            pnpm verify:pr
          fi
        timeout-minutes: 30

      - name: Report release rule
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "QUALITY_GATE=PASSED_FULL (tests, integrity, mobile, SEO, security, lint, types, and production build)"
          else
            echo "QUALITY_GATE=PASSED_PR (tests, integrity, security, lint, types, and architecture)"
          fi
          echo "Vercel automatic Git deployments are disabled."
          echo "Production deployment is available only through the manual release workflow."

name: ZIKR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "ci/circleci: ci-check"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm config set fetch-retries 5
          pnpm config set fetch-timeout 120000
          pnpm config set fetch-retry-mintimeout 20000
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm config set network-concurrency 8
          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
        timeout-minutes: 15

      - name: Run canonical quality gate
        shell: bash
        run: pnpm verify
        timeout-minutes: 30

      - name: Report release rule
        if: success()
        run: |
          echo "QUALITY_GATE=PASSED"
          echo "Vercel automatic Git deployments are disabled."
          echo "Production deployment is available only through the manual release workflow."

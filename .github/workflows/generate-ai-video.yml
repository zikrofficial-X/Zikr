name: ZIKR Autonomous AI Video Worker

on:
  # GitHub Actions is the sole production owner for recurring video generation.
  # Publishing is intentionally handled by a separate GitHub workflow.
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new video jobs to seed in this run"
        required: false
        default: "10"
        type: string
      urgent:
        description: "Whether this dispatch originated from the admin Run Now control"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-autonomous-video-worker
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      # The canonical Supabase URL is public configuration; only the service-role key remains secret.
      SUPABASE_URL: https://ymxdswkaxafakugktsim.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://ymxdswkaxafakugktsim.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      # Free-only production path: no Gemini/cu¶»§q«^
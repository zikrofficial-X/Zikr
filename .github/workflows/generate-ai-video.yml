name: ZIKR Autonomous AI Video Worker

on:
  schedule:
    # Generate and publish content automatically without manual intervention.
    # Two-hour cadence keeps the free runner practical while maintaining a steady feed.
    - cron: "0 */2 * * *"
  push:
    # A workflow change on main is a deliberate production smoke/deploy trigger.
    # Feature-branch edits do not consume runner time.
    # This also gives us a safe, one-shot queue recovery path when an item is
    # already due but the scheduled event has not arrived yet.
    branches:
      - main
    paths:
      - ".github/workflows/generate-ai-video.yml"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new video jobs to seed in this run"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-autonomous-video-worker
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The canonical Supabase URL is public configuration; only the service-role key remains secret.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_AUDIO_SMOKE_TEST: "false"
      AUTO_VIDEO_ENABLED: "true"
      AUTO_VIDEO_BATCH_SIZE: ${{ inputs.batch_size || '1' }}
      VIDEO_BACKGROUND_BATCH_SIZE: "1"
      AUTO_VIDEO_SECONDS: "16"
      BACKGROUND_JOB_TARGET: "all"
      # Generated videos are automatically handed to the configured social publishers.
      SOCIAL_PUBLISH_ENABLED: "true"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v26.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node --version
          pnpm --version

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Verify and install rendering dependencies only when missing
        shell: bash
        run: |
          set -euo pipefail

          missing=""
          need_install=0

          if ! command -v ffmpeg >/dev/null 2>&1; then
            missing="$missing ffmpeg"
            need_install=1
          fi

          if ! command -v rsvg-convert >/dev/null 2>&1; then
            missing="$missing librsvg2-bin"
            need_install=1
          fi

          # The renderer explicitly uses these two Arabic font families.
          # fonts-noto-core contains both; avoid the much larger extra/CJK
          # packages unless a future renderer actually needs them.
          if [[ ! -f /usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf ||
                ! -f /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf ]]; then
            missing="$missing fonts-noto-core"
            need_install=1
          fi

          if [ "$need_install" -eq 1 ]; then
            echo "Installing missing rendering dependencies:$missing"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $missing
          else
            echo "All rendering dependencies are already available on the runner."
          fi

          command -v ffmpeg >/dev/null
          command -v rsvg-convert >/dev/null
          test -f /usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf

          echo "ffmpeg: $(ffmpeg -version | head -n 1)"
          echo "rsvg-convert: $(rsvg-convert --version 2>&1 | head -n 1)"
          echo "Arabic fonts: Noto Naskh Arabic + Noto Sans Arabic available"

      - name: Smoke-test video worker imports
        run: |
          set -euo pipefail
          pnpm exec tsx -e 'Promise.all([import("./scripts/jobs/template-video-automation.ts"), import("./src/features/social/services/social-publishing.ts")]).then(() => console.log("Video worker module smoke test: OK")).catch((error) => { console.error(error); process.exitCode = 1 })'
          ffmpeg -version | head -n 1

      - name: Gemini audio evaluation smoke test
        if: env.GEMINI_AUDIO_SMOKE_TEST == 'true'
        run: pnpm exec tsx scripts/verify-gemini-audio.ts

      - name: Validate automation secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing GitHub Actions secret: SUPABASE_SERVICE_ROLE_KEY" >&2; exit 1; }
          if [[ -z "${YOUTUBE_CLIENT_ID:-}" && -z "${FACEBOOK_PAGE_ID:-}" ]]; then
            echo "Warning: no social provider credentials are configured; videos can still be generated but cannot be published." >&2
          fi

      - name: Verify Supabase data-plane access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/quran_ayahs?select=id&limit=1")"
          echo "Supabase REST quran_ayahs HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "Supabase data-plane authentication/configuration failed:" >&2
            head -c 500 "$response_file" >&2 || true
            exit 1
          fi


      # Manual queue recovery verified 2026-09-29: process due pending videos before social publishing.
      # Free-tier AI path: Gemini plans the source-locked presentation; FFmpeg performs the render locally.
      # Validation pass 2026-09-29: Flash-Lite defaults and structured memorization evaluation are enabled.
      # Isolated Gemini/FFmpeg E2E queue test is prepared in Supabase; social publishing is skipped for the test request.
      # Validation rerun: exercise the free-model fallback path after 3.1 Flash-Lite service availability errors.
      # Audio smoke fix: invoke the Gemini SDK directly in a standalone Node smoke test.

      - name: Run autonomous queue
        run: pnpm background:jobs

      - name: Print run summary
        if: always()
        run: |
          echo "ZIKR autonomous video worker completed."
          echo "The queue seeds source-locked Quran/Hadith/Dua videos and renders them with free FFmpeg."
          echo "Generated videos are automatically queued for configured YouTube/Facebook publishing."
          echo "Gemini uses the configured free-tier model for source-locked planning, reflection, social captioning, and deterministic FFmpeg rendering."
          echo "Worker validation includes Node import, FFmpeg, and Supabase data-plane smoke tests."

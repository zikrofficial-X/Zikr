name: ZIKR Autonomous AI Video Worker

on:
  # GitHub Actions is the sole production owner for recurring video generation.
  # Publishing is intentionally handled by a separate GitHub workflow.
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new video jobs to seed in this run"
        required: false
        default: "3"
        type: string
      urgent:
        description: "Whether this dispatch originated from the admin Run Now control"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-autonomous-video-worker
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      # The canonical Supabase URL is public configuration; only the service-role key remains secret.
      SUPABASE_URL: https://wvetcauyerlkqvmntajq.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://wvetcauyerlkqvmntajq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_AUDIO_SMOKE_TEST: "false"
      AUTO_VIDEO_ENABLED: "true"
      AUTO_VIDEO_BATCH_SIZE: ${{ inputs.batch_size || '3' }}
      VIDEO_BACKGROUND_BATCH_SIZE: "3"
      DAILY_VIDEO_TARGET: "12"
      AUTO_VIDEO_URGENT: ${{ inputs.urgent || 'false' }}
      VIDEO_DAILY_LIMIT: "24"
      VIDEO_AUTOMATION_DRY_RUN: "false"
      VIDEO_AI_ENABLED: "true"
      VIDEO_AI_ATTEMPTS_PER_RUN: "3"
      VIDEO_PROVIDER_ORDER: "hf_ltx_fast,hf_wan,comfyui,free_api"
      HF_WAN_VIDEO_ENABLED: "true"
      HF_LTX_FAST_VIDEO_ENABLED: "true"
      HF_WAN_SPACE: "zerogpu-aoti/wan2-2-fp8da-aoti-faster"
      HF_LTX_FAST_SPACE: "Lightricks/ltx-video-distilled"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ARABIC_TTS_VENV: ${{ github.workspace }}/.automation-venv
      ARABIC_TTS_PROFILE: "hadith_male_msa"
      ARABIC_TTS_PYTHON: ${{ github.workspace }}/.automation-venv/bin/python
      HF_VIDEO_PYTHON: ${{ github.workspace }}/.automation-venv/bin/python
      # Generation queues publishable video records but never executes social publishing.
      AUTO_VIDEO_PUBLISH_ENABLED: "true"
      AUTO_VIDEO_PUBLISH_REQUIRES_APPROVAL: "false"
      AUTO_VIDEO_SECONDS: "18"
      BACKGROUND_JOB_TARGET: "all"
      VIDEO_TEMPLATE_VERSION: "2026-10-08-quality-v3"
      VERIFY_VIDEO_RUNTIME_TOOLS: "true"
      # Social publishing is owned by .github/workflows/publish-social.yml.
      SOCIAL_PUBLISH_ENABLED: "false"
      # Facebook publishing is enabled only when the production environment has both required secrets.
      # The Admin setting can still disable it at runtime.
      SOCIAL_PUBLISH_FACEBOOK_ENABLED: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN != '' && secrets.FACEBOOK_PAGE_ID != '' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v26.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production automation credentials before dependency installation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "Missing canonical SUPABASE_URL configuration." >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing production environment secret: SUPABASE_SERVICE_ROLE_KEY" >&2; exit 1; }
          if [[ -z "${YOUTUBE_CLIENT_ID:-}" && -z "${FACEBOOK_PAGE_ID:-}" ]]; then
            echo "Warning: no social provider credentials are configured; videos can still be generated but cannot be published." >&2
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22 with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Install and verify video and Arabic TTS runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-core python3-venv
          python3 -m venv "$GITHUB_WORKSPACE/.automation-venv"
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -m pip install --quiet --disable-pip-version-check --no-cache-dir "edge-tts==7.2.8" "gradio_client==2.7.1"
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -c 'import edge_tts, gradio_client; print("edge-tts + gradio_client imports: OK")'
          "$GITHUB_WORKSPACE/.automation-venv/bin/edge-tts" --version
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -c 'import gradio_client; print("gradio_client:", gradio_client.__version__)'
          command -v ffmpeg >/dev/null
          command -v rsvg-convert >/dev/null
          test -f /usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf

          for asset in public/video/templates/calm.svg public/video/templates/dawn.svg public/video/templates/night.svg public/video/templates/gold.svg; do
            test -s "$asset"
            out="/tmp/$(basename "$asset" .svg).png"
            rsvg-convert -w 1080 -h 1920 "$asset" -o "$out"
            test -s "$out"
          done

          echo "ffmpeg: $(ffmpeg -version | head -n 1)"
          echo "rsvg-convert: $(rsvg-convert --version 2>&1 | head -n 1)"
          echo "Arabic fonts: Noto Naskh Arabic + Noto Sans Arabic available"

      - name: Smoke-test video worker imports
        run: |
          set -euo pipefail
          pnpm video:engine:check
          pnpm exec tsx -e 'Promise.all([import("./scripts/jobs/template-video-automation.ts"), import("./src/features/social/services/social-publishing.ts")]).then(() => console.log("Video worker module smoke test: OK")).catch((error) => { console.error(error); process.exitCode = 1 })'
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -m py_compile scripts/jobs/hf-space-video.py
          ffmpeg -version | head -n 1

      - name: Gemini audio evaluation smoke test
        if: env.GEMINI_AUDIO_SMOKE_TEST == 'true'
        run: pnpm exec tsx scripts/verify-gemini-audio.ts

      - name: Verify Supabase data-plane access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/quran_ayahs?select=id&limit=1")"
          echo "Supabase REST quran_ayahs HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "Supabase data-plane authentication/configuration failed:" >&2
            head -c 500 "$response_file" >&2 || true
            exit 1
          fi


      # Scheduled production and deliberate manual recovery are both executed by this GitHub workflow.
      # Free-tier AI path: Gemini plans the source-locked presentation; FFmpeg performs the render locally.
      # Validation pass 2026-09-29: Flash-Lite defaults and structured memorization evaluation are enabled.
      # Isolated Gemini/FFmpeg E2E queue test is prepared in Supabase; social publishing is skipped for the test request.
      # Validation rerun: exercise the free-model fallback path after 3.1 Flash-Lite service availability errors.
      # Audio smoke fix: invoke the Gemini SDK directly in a standalone Node smoke test.

      - name: Run autonomous queue
        run: pnpm background:jobs

      - name: Print run summary
        if: always()
        run: |
          echo "ZIKR autonomous video worker completed."
          echo "The queue seeds Quran/Hadith/Dua/Adhkar/verified-story/general-reminder videos and renders them with rotating free AI providers plus deterministic template fallback."
          echo "Generated videos are queued for the separate GitHub Actions social publisher."
          echo "Gemini uses the configured free-tier model for source-locked planning, reflection, social captioning, and deterministic FFmpeg rendering."
          echo "Worker validation includes Node import, FFmpeg, and Supabase data-plane smoke tests."

name: Generate ZIKR AI Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video topic or title
        required: true
        default: Daily Islamic Reminder
        type: string
      language:
        description: Content language
        required: true
        default: ar
        type: string
      seconds:
        description: Approximate duration in seconds
        required: true
        default: '12'
        type: string

permissions:
  contents: read

concurrency:
  group: generate-ai-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_LANGUAGE: ${{ inputs.language }}
      VIDEO_SECONDS: ${{ inputs.seconds }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash-lite' }}
      VIDEO_OUTPUT_DIR: generated-video
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-core fonts-noto-extra

      - name: Generate AI-assisted MP4
        run: node scripts/generate-ai-video.mjs

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: zikr-ai-video-${{ github.run_number }}
          path: generated-video/
          if-no-files-found: error
          retention-days: 14

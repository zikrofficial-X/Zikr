name: Temporary image asset migration

on:
  push:
    branches:
      - fix/image-performance-audit-2026-10-15
    paths:
      - .github/workflows/temporary-image-asset-migration.yml

permissions:
  contents: write

jobs:
  optimize-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary image encoder
        run: npm install --no-save --package-lock=false sharp
      - name: Optimize local image assets
        run: node scripts/temporary-optimize-image-assets.mjs
      - name: Commit optimized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/branding public/kids/games
          git diff --cached --check
          git commit -m "perf(images): optimize image assets and remove originals [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

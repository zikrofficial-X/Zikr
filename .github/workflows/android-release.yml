name: Android Release

# Android releases are built and published by CircleCI.
# Keep this manual-only fallback so GitHub-hosted runner billing failures cannot
# create false red checks or duplicate releases.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web application
        run: pnpm verify

      - name: Build web assets and sync Capacitor
        run: |
          pnpm build
          pnpm exec cap sync android

      - name: Verify mobile configuration
        env:
          ANDROID_APP_LINKS_SHA256: ${{ secrets.ANDROID_APP_LINKS_SHA256 }}
        run: MOBILE_RELEASE_CHECK=1 pnpm mobile:check

      - name: Validate signing inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected Android release secret: ${name}" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/zikr-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zikr-signing/zikr-release.keystore"
          cat > android/keystore.properties <<'EOF'
          storeFile=$RUNNER_TEMP/zikr-signing/zikr-release.keystore
          storeType=jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

      - name: Build signed APK and AAB
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2

      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          apksigner verify --verbose "$APK"
          sha256sum "$APK" "$AAB" | tee SHA256SUMS
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | grep -Fx 'com.zikr.app'

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "ZIKR $GITHUB_REF_NAME"

name: Android Release

# Android release pipeline for signed APK/AAB artifacts.
# Builds explicit release tags manually, or automatically after Create Release Tag succeeds.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (for example v1.4.18)'
        required: true
        default: v1.4.18
  workflow_run:
    workflows:
      - Create Release Tag
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  release:
    name: Build signed Android release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release/v'))
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.workflow_run.head_sha }}

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_REF="${{ inputs.release_tag }}"
          else
            RAW_REF="${{ github.event.workflow_run.head_branch }}"
          fi
          if [[ "$RAW_REF" == release/v* ]]; then
            RELEASE_TAG="${RAW_REF#release/}"
          else
            RELEASE_TAG="$RAW_REF"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Resolved release tag: $RELEASE_TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not set by setup-android." >&2
            exit 1
          fi
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          BUILD_TOOLS_BIN="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"
          test -x "$BUILD_TOOLS_BIN/apksigner"
          test -x "$BUILD_TOOLS_BIN/zipalign"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          echo "$BUILD_TOOLS_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web application
        run: pnpm verify

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Verify mobile configuration
        env:
          ANDROID_APP_LINKS_SHA256: ${{ secrets.ANDROID_APP_LINKS_SHA256 }}
        run: MOBILE_RELEASE_CHECK=1 MOBILE_RELEASE_PLATFORM=android MOBILE_RELEASE_CHANNEL=github pnpm mobile:check

      - name: Validate release metadata
        run: node scripts/verify-release-metadata.mjs

      - name: Validate signing inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected Android release secret: ${name}" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/zikr-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zikr-signing/zikr-release.keystore"
          STORE_TYPE="PKCS12"
          if keytool -list -keystore "$RUNNER_TEMP/zikr-signing/zikr-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            STORE_TYPE="PKCS12"
          elif keytool -list -storetype JKS -keystore "$RUNNER_TEMP/zikr-signing/zikr-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            STORE_TYPE="JKS"
          else
            echo "Unable to open the release keystore with PKCS12 or JKS." >&2
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/zikr-signing/zikr-release.keystore
          storeType=$STORE_TYPE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

      - name: Build signed APK and AAB
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --parallel --max-workers=2 --stacktrace --warning-mode all

      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_BIN="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$BUILD_TOOLS_BIN/apksigner" verify --verbose "$APK"
          sha256sum "$APK" "$AAB" | tee SHA256SUMS
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          "$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | grep -Fx 'com.zikr.app'
          "$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK" | grep -Fx "$EXPECTED_VERSION"
          "$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest target-sdk "$APK" | grep -Fx '36'

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$AAB" SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" "$AAB" SHA256SUMS --verify-tag --generate-notes --title "ZIKR $RELEASE_TAG"
          fi

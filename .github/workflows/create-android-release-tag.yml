name: Create Android Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: zikr-android-release-tag
  cancel-in-progress: false

jobs:
  tag-and-draft:
    name: Create release tag and draft
    if: startsWith(github.event.head_commit.message, '[PRODUCTION RELEASE]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAG="$(tr -d '\r\n' < .release-tag)"
          test "$TAG" = "v$VERSION"
          test -f "docs/releases/${VERSION}.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create or repair tag and draft GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const version = process.env.VERSION;
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = fs.readFileSync(`docs/releases/${version}.md`, 'utf8');
            const retry = fs.existsSync('docs/finalization/RELEASE_RETRY.flag');

            let tagExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              tagExists = false;
            }

            if (retry && tagExists) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha,
                force: true,
              });
            } else if (!tagExists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
            }

            const buildTag = `${tag}-build`;
            let buildTagExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${buildTag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              buildTagExists = false;
            }

            if (!buildTagExists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${buildTag}`,
                sha,
              });
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existing = releases.find((release) => release.tag_name === tag);

            if (!existing) {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: sha,
                name: `ZIKR Android ${tag}`,
                body,
                draft: true,
                prerelease: false,
                generate_release_notes: false,
              });
            }
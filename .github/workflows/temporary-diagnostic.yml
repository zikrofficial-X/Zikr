name: Temporary Repository Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Local imports
        run: pnpm imports:check
      - name: Routes
        run: pnpm routes:check
      - name: Project integrity
        run: pnpm project:check
      - name: Canonical configuration
        run: pnpm canonical:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm check
      - name: Production build
        run: pnpm build

name: Build and Publish Android v1.1.2
# release fallback verifier

on:
  push:
    branches:
      - main
    paths:
      - docs/releases/1.1.2.md
      - docs/finalization/RELEASE_RETRY.flag
      - .github/workflows/build-publish-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-v1.1.2
  cancel-in-progress: false

jobs:
  android:
    name: Build verify and publish Android release
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v1.1.2
          fetch-depth: 1

      - name: Validate release secrets and metadata
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!key:-}" || { echo "Missing GitHub Secret: $key" >&2; exit 1; }
          done
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          test "$VERSION" = "1.1.2"
          test "$(tr -d '\r\n' < .release-tag)" = "v1.1.2"
          grep -F 'versionCode 56' android/app/build.gradle

      - name: Setup Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node --version
          pnpm --version

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        timeout-minutes: 15

      - name: Build web
        run: pnpm build
        timeout-minutes: 20

      - name: Prepare mobile assets
        run: pnpm mobile:prepare

      - name: Capacitor sync
        run: pnpm exec cap sync android
        timeout-minutes: 10

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/.release-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.release-signing/zikr-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=.release-signing/zikr-release.keystore
          storeType=PKCS12
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          chmod 600 android/keystore.properties android/.release-signing/zikr-release.keystore

      - name: Build signed APK and AAB
        run: |
          cd android
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2 --stacktrace
        timeout-minutes: 30

      - name: Verify APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -1)"
          test -s "$APK"
          test -s "$AAB"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKANALYZER" manifest application-id "$APK" | grep -Fx 'com.zikr.app'
          "$APKANALYZER" manifest version-name "$APK" | grep -Fx '1.1.2'
          "$APKANALYZER" manifest version-code "$APK" | grep -Fx '56'
          "$APKANALYZER" manifest target-sdk "$APK" | grep -Fx '36'
          jarsigner -verify "$AAB"

      - name: Generate SHA256SUMS and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          sha256sum "$APK" "$AAB" | sed 's#android/app/build/outputs/apk/release/##; s#android/app/build/outputs/bundle/release/##' > SHA256SUMS
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          AAB_SHA="$(sha256sum "$AAB" | awk '{print $1}')"
          cat > release-metadata.json <<EOF
          {
            "tag": "v1.1.2",
            "version": "1.1.2",
            "versionCode": 56,
            "applicationId": "com.zikr.app",
            "targetSdk": 36,
            "sourceCommit": "${GITHUB_SHA}",
            "apkSha256": "${APK_SHA}",
            "aabSha256": "${AAB_SHA}"
          }
          EOF

      - name: Upload verified artifacts to Supabase
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL="${SUPABASE_URL%/}"
          BUCKET="android-releases"
          BASE="android/v1.1.2"
          API="${SUPABASE_URL}/storage/v1/object"
          PUBLIC="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${BASE}"
          upload() {
            local file="$1" object="$2" mime="$3"
            curl --fail --silent --show-error --location               --request POST "${API}/${BUCKET}/${object}"               --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"               --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"               --header "x-upsert: true"               --header "Content-Type: ${mime}"               --data-binary "@${file}" >/dev/null
          }
          upload android/app/build/outputs/apk/release/app-release.apk "${BASE}/app-release.apk" application/vnd.android.package-archive
          upload android/app/build/outputs/bundle/release/app-release.aab "${BASE}/app-release.aab" application/octet-stream
          upload SHA256SUMS "${BASE}/SHA256SUMS" text/plain
          upload release-metadata.json "${BASE}/release-metadata.json" application/json
          curl --fail --silent --show-error --location "${PUBLIC}/app-release.apk" -o /tmp/app-release.apk
          curl --fail --silent --show-error --location "${PUBLIC}/app-release.aab" -o /tmp/app-release.aab
          test "$(sha256sum /tmp/app-release.apk | awk '{print $1}')" = "$(sha256sum android/app/build/outputs/apk/release/app-release.apk | awk '{print $1}')"
          test "$(sha256sum /tmp/app-release.aab | awk '{print $1}')" = "$(sha256sum android/app/build/outputs/bundle/release/app-release.aab | awk '{print $1}')"

      - name: Update Supabase release record
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL="${SUPABASE_URL%/}"
          PUBLIC="${SUPABASE_URL}/storage/v1/object/public/android-releases/android/v1.1.2"
          APK_SHA="$(awk '$2=="app-release.apk"{print $1}' SHA256SUMS)"
          AAB_SHA="$(awk '$2=="app-release.aab"{print $1}' SHA256SUMS)"
          cat > /tmp/android-release.json <<EOF
          [{
            "key":"android_release",
            "value": {
              "mode":"github-supabase",
              "status":"published",
              "releaseTag":"v1.1.2",
              "version":"1.1.2",
              "versionCode":56,
              "applicationId":"com.zikr.app",
              "targetSdk":36,
              "sourceCommit":"${GITHUB_SHA}",
              "releaseUrl":"https://github.com/zikr-org/Zikr/releases/tag/v1.1.2",
              "apkUrl":"${PUBLIC}/app-release.apk",
              "aabUrl":"${PUBLIC}/app-release.aab",
              "sha256Url":"${PUBLIC}/SHA256SUMS",
              "metadataUrl":"${PUBLIC}/release-metadata.json",
              "apkSha256":"${APK_SHA}",
              "aabSha256":"${AAB_SHA}"
            },
            "updated_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }]
          EOF
          curl --fail --silent --show-error --location             --request PATCH "${SUPABASE_URL}/rest/v1/site_settings?key=eq.android_release"             --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             --header "Content-Type: application/json"             --header "Prefer: return=minimal"             --data-binary @/tmp/android-release.json >/dev/null

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.1.2 --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release upload v1.1.2             android/app/build/outputs/apk/release/app-release.apk             android/app/build/outputs/bundle/release/app-release.aab             SHA256SUMS             release-metadata.json             --repo "${GITHUB_REPOSITORY}"             --clobber
          gh release edit v1.1.2             --repo "${GITHUB_REPOSITORY}"             --draft=false             --prerelease=false             --latest=true

      - name: Clean signing material
        if: always()
        shell: bash
        run: |
          rm -f android/keystore.properties
          rm -f android/.release-signing/zikr-release.keystore
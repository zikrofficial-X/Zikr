name: ZIKR Guarded Supabase Migration History Reconciliation

on:
  # This does not deploy the application. A one-shot marker authorizes only the
  # schema/data preflight and migration-ledger reconciliation on the production DB.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECONCILE to authorize guarded migration-history reconciliation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-supabase-migration-history-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Guarded migration-history reconciliation (no deploy)
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RECONCILE') ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[reconcile-supabase-history]'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      EXPECTED_PROJECT_REF: ymxdswkaxafakugktsim
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify required credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test "${EXPECTED_PROJECT_REF}" = "ymxdswkaxafakugktsim"
          python3 scripts/verify-supabase-db-url.py

      - name: Prove schema/data parity and reconcile history only
        shell: bash
        run: bash scripts/reconcile-supabase-migration-history.sh

      - name: Reconciliation evidence
        if: success()
        run: |
          {
            echo "## Supabase Migration History Reconciliation"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Target project: ${EXPECTED_PROJECT_REF}"
            echo "- Schema/data preflight: passed"
            echo "- Operation: migration ledger only; no application deployment"
          } >> "${GITHUB_STEP_SUMMARY}"

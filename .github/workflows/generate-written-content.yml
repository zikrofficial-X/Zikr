name: ZIKR Internal Site Content Generator
on:
  schedule:
    - cron: "15 7,13,19 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Content category"
        required: false
        default: "auto"
        type: choice
        options: [auto, quran, hadith, dua, story, prophets, companions, knowledge, kids]
      batch_size:
        description: "Number of ZIKR website articles to schedule (bounded)"
        required: false
        default: "1"
        type: string
permissions:
  contents: read
concurrency:
  group: zikr-written-content-factory
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      GEMINI_MODEL: gemini-3.1-flash-lite
      WRITTEN_CONTENT_ENABLED: "true"
      WRITTEN_CONTENT_DAILY_TARGET: "3"
      WRITTEN_CONTENT_BATCH_SIZE: ${{ inputs.batch_size || '1' }}
      WRITTEN_CONTENT_CATEGORY: ${{ inputs.category || 'auto' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate runtime secrets
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::Missing Supabase service-role secret." >&2; exit 1; }
          test -n "${GEMINI_API_KEY:-}" || { echo "::error::Missing GEMINI_API_KEY Actions secret in the production environment." >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Verify written-content contracts
        run: pnpm written-content:check
      - name: Generate and enqueue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm written-content:generate -- --category "${WRITTEN_CONTENT_CATEGORY}" --batch-size "${WRITTEN_CONTENT_BATCH_SIZE}"

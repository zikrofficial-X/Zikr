name: Security Audit

# Manual security gate. The comprehensive application verification remains in
# ci.yml; this workflow exposes the security-focused checks separately.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and configuration audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Deployment environment validation
        run: pnpm deploy:check

      - name: Repository hygiene validation
        run: pnpm hygiene:check

      - name: Authentication configuration validation
        run: pnpm auth:check

      - name: Canonical URL configuration validation
        run: pnpm canonical:check

      - name: Migration chain validation
        run: pnpm supabase:migrations:check

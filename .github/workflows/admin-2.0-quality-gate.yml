name: Admin 2.0 Quality Gate
# Verification gate: migrations, integrity, tests, lint, and production build.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zikr-admin-2-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:migrations:check
      - run: pnpm supabase:migrations:replay
      - run: pnpm routes:check
      - run: pnpm imports:check
      - run: pnpm hygiene:check
      - run: pnpm placeholder-media:check
      - run: pnpm project:check
      - run: pnpm mobile:check
      - run: pnpm offline:check
      - run: pnpm content:check
      - run: pnpm auth:check
      - run: pnpm canonical:check
      - run: pnpm native-social:check
      - run: pnpm adsense:check
      - run: pnpm search-console:check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - name: Production build
        run: pnpm build

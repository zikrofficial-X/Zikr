name: Admin 2.0 Quality Gate
on:
  push:
    branches: [main, feat/admin-2.0-control-center]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zikr-admin-2-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:migrations:check
      - run: pnpm supabase:migrations:replay
      - run: pnpm routes:check
      - run: pnpm imports:check
      - run: pnpm project:check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

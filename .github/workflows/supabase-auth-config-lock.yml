name: Supabase Auth Config Lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-supabase-auth-config-lock
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical Supabase Auth URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm canonical:check

  enforce:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    name: Enforce canonical Supabase Auth URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: eydxvcamhjhajxjrsgym
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Link the production project
        run: pnpm dlx supabase@latest link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Push the canonical project configuration
        run: pnpm dlx supabase@latest config push

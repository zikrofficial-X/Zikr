name: Supabase Auth Config Lock

on:
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "scripts/verify-canonical-config.mjs"
      - "docs/CANONICAL_AUTH_CONFIG.md"
      - ".github/workflows/supabase-auth-config-lock.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-supabase-auth-config-lock
  cancel-in-progress: true

jobs:
  enforce:
    name: Enforce canonical Supabase Auth URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: eydxvcamhjhajxjrsgym
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate the locked values locally
        run: pnpm canonical:check

      - name: Require Supabase management token
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. This secret is required to enforce the remote Supabase Auth URL lock."
            exit 1
          }

      - name: Link the production project
        run: pnpm dlx supabase@latest link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Push the canonical project configuration
        run: pnpm dlx supabase@latest config push

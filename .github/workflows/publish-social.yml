name: ZIKR Automated Social Publisher

on:
  # Drain only post-launch queue rows and retry deferred providers after cooldowns.
  # This bounded poll complements the immediate run after successful generation.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: ["ZIKR Autonomous AI Video Worker", "ZIKR Internal Site Content Generator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Publish only eligible items created after the controlled go-live cutoff."
        required: true
        default: publish_queue
        type: choice
        options:
          - publish_queue

permissions:
  contents: read

concurrency:
  group: zikr-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ (github.event_name == 'schedule' &&
            github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main') ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.operation == 'publish_queue') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      BACKGROUND_JOB_TARGET: "social"
      SOCIAL_PUBLISH_ENABLED: "true"
      SOCIAL_SYNC_INSIGHTS: "false"
      SOCIAL_PUBLISH_BATCH_SIZE: "5"
      # Only post-activation queue rows are eligible; historical rows remain excluded.
      SOCIAL_PUBLISH_AFTER: "2026-11-06T20:00:00Z"
      FACEBOOK_PUBLISHING_REQUESTED: ${{ vars.FACEBOOK_PUBLISHING_ENABLED || 'true' }}
      YOUTUBE_PUBLISHING_REQUESTED: ${{ vars.YOUTUBE_PUBLISHING_ENABLED || 'true' }}
      FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v26.0' }}
      YOUTUBE_UPLOAD_PRIVACY: "public"

    steps:
      - name: Record trigger
        shell: bash
        run: |
          echo "Social publishing triggered by: ${GITHUB_EVENT_NAME}"
          echo "Queue cutoff: ${SOCIAL_PUBLISH_AFTER}"
          echo "Batch size: ${SOCIAL_PUBLISH_BATCH_SIZE}"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate production credentials and isolate enabled providers
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::Missing Supabase service-role secret." >&2; exit 1; }
          test -n "${CLOUDINARY_CLOUD_NAME:-}" || { echo "::error::Missing Cloudinary cloud name." >&2; exit 1; }
          test -n "${CLOUDINARY_API_KEY:-}" || { echo "::error::Missing Cloudinary API key." >&2; exit 1; }
          test -n "${CLOUDINARY_API_SECRET:-}" || { echo "::error::Missing Cloudinary API secret." >&2; exit 1; }

          facebook_ready=false
          facebook_insights_ready=false
          if [[ "${FACEBOOK_PUBLISHING_REQUESTED,,}" == "true" ]]; then
            if ! facebook_json="$(curl -fsS \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/rest/v1/social_platform_credentials?platform=eq.facebook&is_enabled=eq.true&connection_status=eq.connected&page_id=not.is.null&page_id=neq.&page_access_token=not.is.null&page_access_token=neq.&select=is_enabled,connection_status,page_id,expires_at,granted_permissions&limit=1")"; then
              echo "::warning::Facebook credential lookup failed; disabling only Facebook publishing for this run." >&2
              facebook_json='[]'
            fi
            if ! facebook_readiness="$(node -e '
              let rows;
              try { rows = JSON.parse(process.argv[1]); } catch {
                process.stdout.write("false|false");
                process.exit(0);
              }
              const row = Array.isArray(rows) ? rows[0] : null;
              const expires = row?.expires_at ? Date.parse(row.expires_at) : null;
              const fresh = expires === null || (Number.isFinite(expires) && expires > Date.now());
              const scopes = Array.isArray(row?.granted_permissions) ? row.granted_permissions : [];
              const required = ["pages_show_list", "pages_read_engagement", "pages_manage_posts"];
              const scopesOkay = required.every(scope => scopes.includes(scope));
              const publishReady = Boolean(row?.is_enabled === true && row?.connection_status === "connected" && row?.page_id && fresh && scopesOkay);
              const insightsReady = scopes.includes("read_insights");
              process.stdout.write(String(publishReady) + "|" + String(insightsReady));
            ' "$facebook_json")"; then
              echo "::warning::Facebook credential response could not be evaluated; disabling only Facebook publishing for this run." >&2
              facebook_readiness='false|false'
            fi
            IFS='|' read -r facebook_ready facebook_insights_ready <<< "$facebook_readiness"
          fi
          echo "SOCIAL_PUBLISH_FACEBOOK_ENABLED=$facebook_ready" >> "$GITHUB_ENV"

          youtube_client_id_present=false
          if [[ -n "${YOUTUBE_CLIENT_ID:-}" ]]; then youtube_client_id_present=true; fi
          youtube_client_secret_present=false
          if [[ -n "${YOUTUBE_CLIENT_SECRET:-}" ]]; then youtube_client_secret_present=true; fi
          youtube_scopes_ready=false
          youtube_ready=false
          if [[ "${YOUTUBE_PUBLISHING_REQUESTED,,}" == "true" && "$youtube_client_id_present" == "true" && "$youtube_client_secret_present" == "true" ]]; then
            if ! youtube_json="$(curl -fsS \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/rest/v1/youtube_oauth_credentials?provider=eq.youtube&refresh_token=not.is.null&refresh_token=neq.&channel_id=not.is.null&channel_id=neq.&select=granted_scopes&limit=1")"; then
              echo "::warning::YouTube credential lookup failed; disabling only YouTube publishing for this run." >&2
              youtube_json='[]'
            fi
            if ! youtube_scopes_ready="$(node -e '
              let rows;
              try { rows = JSON.parse(process.argv[1]); } catch {
                process.stdout.write("false");
                process.exit(0);
              }
              const scopes = Array.isArray(rows?.[0]?.granted_scopes) ? rows[0].granted_scopes : [];
              const required = [
                "https://www.googleapis.com/auth/youtube.upload",
                "https://www.googleapis.com/auth/youtube.readonly",
                "https://www.googleapis.com/auth/yt-analytics.readonly"
              ];
              const deleteCapable = [
                "https://www.googleapis.com/auth/youtube",
                "https://www.googleapis.com/auth/youtube.force-ssl",
                "https://www.googleapis.com/auth/youtubepartner"
              ];
              process.stdout.write(String(
                required.every(scope => scopes.includes(scope)) &&
                !scopes.some(scope => deleteCapable.includes(scope))
              ));
            ' "$youtube_json")"; then
              echo "::warning::YouTube credential response could not be evaluated; disabling only YouTube publishing for this run." >&2
              youtube_scopes_ready=false
            fi
            youtube_ready="$youtube_scopes_ready"
          fi
          echo "SOCIAL_PUBLISH_YOUTUBE_ENABLED=$youtube_ready" >> "$GITHUB_ENV"

          {
            echo "### Social publishing readiness"
            echo "- Facebook publishing requested: $FACEBOOK_PUBLISHING_REQUESTED"
            echo "- Facebook credential ready for publishing: $facebook_ready"
            echo "- Facebook Reels insights permission granted (optional): $facebook_insights_ready"
            echo "- YouTube publishing requested: $YOUTUBE_PUBLISHING_REQUESTED"
            echo "- YouTube client ID configured: $youtube_client_id_present"
            echo "- YouTube client secret configured: $youtube_client_secret_present"
            echo "- YouTube OAuth credential and scopes ready: $youtube_scopes_ready"
            echo "- YouTube publishing ready: $youtube_ready"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Facebook publishing readiness: $facebook_ready"
          echo "Facebook Reels insights permission granted (optional): $facebook_insights_ready"
          echo "YouTube client ID configured: $youtube_client_id_present"
          echo "YouTube client secret configured: $youtube_client_secret_present"
          echo "YouTube OAuth credential and scope readiness: $youtube_scopes_ready"
          echo "YouTube upload readiness: $youtube_ready"
          if [[ "$facebook_ready" != "true" && "$youtube_ready" != "true" ]]; then
            echo "::warning::No social provider has a verified publishing credential. Publishing is skipped; no queue item will be claimed."
            echo "SOCIAL_PUBLISH_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Verify social publishing and scheduler contracts
        run: |
          pnpm scheduler:check
          pnpm social:publish:check

      - name: Run automated-QA social queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          ADMIN_QUEUE_ALERT_WEBHOOK_URL: ${{ secrets.ADMIN_QUEUE_ALERT_WEBHOOK_URL }}
          ADMIN_QUEUE_ALERT_WEBHOOK_SECRET: ${{ secrets.ADMIN_QUEUE_ALERT_WEBHOOK_SECRET }}
          ADMIN_QUEUE_ALERT_EMAIL_TO: ${{ vars.ADMIN_QUEUE_ALERT_EMAIL_TO || secrets.ADMIN_QUEUE_ALERT_EMAIL_TO }}
          ADMIN_QUEUE_ALERT_EMAIL_FROM: ${{ vars.ADMIN_QUEUE_ALERT_EMAIL_FROM || secrets.ADMIN_QUEUE_ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: pnpm background:jobs

      - name: Report completion
        if: always()
        shell: bash
        run: |
          echo "Social worker finished. Only rows created on/after ${SOCIAL_PUBLISH_AFTER} are eligible."
          echo "Manual video approval is not required; each video is revalidated against its automated QA snapshot immediately before publishing."

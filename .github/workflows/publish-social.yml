name: ZIKR Autonomous Social Publisher

on:
  # GitHub Actions is the sole production owner for social/video publishing.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ymxdswkaxafakugktsim.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://ymxdswkaxafakugktsim.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      BACKGROUND_JOB_TARGET: "social"
      SOCIAL_PUBLISH_ENABLED: "false"
      AUTO_VIDEO_PUBLISH_ENABLED: "false"
      AUTO_VIDEO_PUBLISH_REQUIRES_APPROVAL: "true"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v26.0' }}
      ADMIN_QUEUE_ALERT_WEBHOOK_URL: ${{ secrets.ADMIN_QUEUE_ALERT_WEBHOOK_URL }}
      ADMIN_QUEUE_ALERT_WEBHOOK_SECRET: ${{ secrets.ADMIN_QUEUE_ALERT_WEBHOOK_SECRET || secrets.WEBHOOK_SECRET }}
      ADMIN_QUEUE_ALERT_EMAIL_TO: ${{ vars.ADMIN_QUEUE_ALERT_EMAIL_TO || secrets.ADMIN_QUEUE_ALERT_EMAIL_TO }}
      ADMIN_QUEUE_ALERT_EMAIL_FROM: ${{ vars.ADMIN_QUEUE_ALERT_EMAIL_FROM || secrets.ADMIN_QUEUE_ALERT_EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Validate publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::Missing canonical SUPABASE_URL configuration." >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::Missing production Supabase service-role secret." >&2; exit 1; }
          # The Facebook Page token is managed by the admin OAuth center and stored
          # in the server-only Supabase table. Do not duplicate it in GitHub Actions.
          facebook_response="$(mktemp)"
          facebook_status="$(curl -sS -o "$facebook_response" -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/social_platform_credentials?platform=eq.facebook&select=page_id,is_enabled,connection_status,expires_at&limit=1")"
          facebook_enabled="false"
          if [[ "$facebook_status" == "200" ]]; then
            facebook_enabled="$(node -e '
              const fs = require("node:fs");
              let rows = [];
              try { rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch {}
              const row = Array.isArray(rows) ? rows[0] : null;
              const expiry = row?.expires_at ? Date.parse(row.expires_at) : NaN;
              const expiryOkay = !row?.expires_at || (Number.isFinite(expiry) && expiry > Date.now());
              console.log(
                row?.is_enabled === true &&
                row?.connection_status === "connected" &&
                typeof row?.page_id === "string" &&
                row.page_id.length > 0 &&
                expiryOkay ? "true" : "false"
              );
            ' "$facebook_response")"
          else
            echo "::warning::Unable to inspect the OAuth-managed Facebook connection (HTTP $facebook_status); Facebook will remain disabled for this run." >&2
          fi
          echo "SOCIAL_PUBLISH_FACEBOOK_ENABLED=$facebook_enabled" >> "$GITHUB_ENV"

          youtube_configured="false"
          if [[ -n "${YOUTUBE_CLIENT_ID:-}" && -n "${YOUTUBE_CLIENT_SECRET:-}" && -n "${YOUTUBE_REFRESH_TOKEN:-}" ]]; then
            youtube_configured="true"
          fi
          if [[ "$youtube_configured" != "true" && "$facebook_enabled" != "true" ]]; then
            echo "::error::No ready social provider is configured. Connect Facebook from /admin/social or configure YouTube OAuth." >&2
            exit 1
          fi
          rm -f "$facebook_response"
          echo "Social publisher runtime configuration: OK (Facebook OAuth-managed=$facebook_enabled, YouTube configured=$youtube_configured)"

      - name: Verify scheduler and social publishing contracts
        run: |
          pnpm scheduler:check
          pnpm social:publish:check

      - name: Verify Supabase data-plane access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}'             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             "$SUPABASE_URL/rest/v1/social_publish_queue?select=id&limit=1")"
          echo "Supabase social queue HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            head -c 500 "$response_file" >&2 || true
            exit 1
          fi

      - name: Process social publishing queue
        run: pnpm background:jobs

      - name: Publish summary
        if: always()
        run: |
          echo "ZIKR GitHub Actions social publisher completed."
          echo "It reconciles completed video records into the social queue and processes pending YouTube/Facebook targets."
          echo "CircleCI does not execute production video generation or social publishing."

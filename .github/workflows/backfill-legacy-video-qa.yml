name: ZIKR Legacy Video QA Backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-legacy-video-qa.yml"
      - "scripts/jobs/backfill-legacy-video-qa.ts"
      - "scripts/jobs/template-video-automation.ts"
      - "src/features/videos/services/video-publish-approval.ts"
      - "src/features/videos/providers/content-hash.ts"
      - "supabase/migrations/20261110031431_retry_false_blocked_legacy_qa_source_url_parity.sql"
      - "src/features/videos/providers/ai-visual-policy.ts"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply verified QA updates to production rows (manual approval only)"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "Type APPLY_QA_BACKFILL to authorize production QA metadata updates"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: zikr-legacy-video-qa-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      # Production row updates require an explicit manual dispatch and typed owner confirmation.
      BACKFILL_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.confirmation == 'APPLY_QA_BACKFILL' }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Require explicit owner confirmation before production updates
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        shell: bash
        env:
          BACKFILL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${BACKFILL_CONFIRMATION}" = "APPLY_QA_BACKFILL" || {
            echo "::error::Production QA backfill requires typed confirmation APPLY_QA_BACKFILL." >&2
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate production database credential
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "::error::Missing Supabase service-role secret for legacy QA backfill." >&2
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
        timeout-minutes: 15

      - name: Revalidate legacy automated QA
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ "${BACKFILL_APPLY:-false}" = "true" ]; then
            echo "Mode: manual apply of source-verified QA updates."
            pnpm exec tsx scripts/jobs/backfill-legacy-video-qa.ts --apply
          else
            echo "Mode: dry-run only; no production rows will be updated."
            pnpm exec tsx scripts/jobs/backfill-legacy-video-qa.ts
          fi
        timeout-minutes: 15

      - name: Report completion
        if: always()
        run: echo "Automatic runs are read-only dry-runs. Production row updates require a manual workflow dispatch with apply=true and typed confirmation APPLY_QA_BACKFILL; the backfill verifies current sources and Cloudinary media and never creates or republishes social queue items."

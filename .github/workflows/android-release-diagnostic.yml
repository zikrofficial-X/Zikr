name: Android Release Diagnostic

on:
  push:
    branches:
      - release-diagnostics-v1.1.2

permissions:
  contents: read

jobs:
  android-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node --version
          pnpm --version
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        timeout-minutes: 10
      - name: Build web
        run: pnpm build
        timeout-minutes: 15
      - name: Prepare mobile assets
        run: pnpm mobile:prepare
      - name: Capacitor sync
        run: pnpm exec cap sync android
        timeout-minutes: 10
      - name: Gradle release preflight
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --stacktrace --warning-mode all
        timeout-minutes: 20
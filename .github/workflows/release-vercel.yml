name: ZIKR Production Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to authorize a production deployment from main"
        required: true
        type: string
      release_reason:
        description: "Stage or milestone being released"
        required: true
        type: string
  # One-shot release hook for the verified admin refactor. It is guarded by
  # the exact release marker below and does not enable general auto-deploys.
  workflow_run:
    workflows: ["ZIKR Quality Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: zikr-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and deploy production
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'RELEASE'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        contains(github.event.workflow_run.head_commit.message, 'ZIKR_ADMIN_RELEASE_20261002')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      VERCEL_ORG_ID: zikr1
      VERCEL_PROJECT_ID: prj_JAsYThJCoUT3DzPxOU2EdmuwxiV5
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
        timeout-minutes: 15

      - name: Lightweight release integrity gate
        shell: bash
        run: pnpm verify:pr
        timeout-minutes: 15

      - name: Install pinned Vercel CLI
        shell: bash
        run: npm install --global vercel@59.23.1

      - name: Validate release configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "Missing GitHub Actions secret: VERCEL_TOKEN" >&2; exit 1; }
          test -n "${VERCEL_ORG_ID:-}" || { echo "Missing Vercel team scope." >&2; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "Missing Vercel project ID." >&2; exit 1; }

      - name: Link exact Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel link --yes --project="${VERCEL_PROJECT_ID}" --scope="${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"

      - name: Pull production Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt artifact to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Release evidence
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## ZIKR Production Release"
            echo ""
            echo "- Stage: ${{ github.event_name == 'workflow_run' && 'إصدار لوحة الإدارة بعد بوابة الجودة' || inputs.release_reason }}"
            echo "- Commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Quality gate: PASSED"
            echo "- Vercel Git auto-deploy: DISABLED"
          } >> "$GITHUB_STEP_SUMMARY"

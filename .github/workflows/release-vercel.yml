name: ZIKR Production Smoke Verification

on:
  # Read-only live smoke test; run manually after a production deployment.
  # Ordinary source pushes do not enqueue this operational check.
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to authorize a production verification from main"
        required: true
        type: string
      release_reason:
        description: "Stage or milestone being released"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live production
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RELEASE'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    environment:
      name: production
    env:
      SITE_URL: https://zikrmediaofficial.vercel.app
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify live production
        run: node scripts/verify-production-smoke.mjs
      - name: Smoke evidence
        run: |
          {
            echo "## ZIKR Production Release"
            echo ""
            echo "- Stage: ${{ inputs.release_reason || 'One-shot production smoke check' }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Deployment: Existing production alias (smoke verification only; this workflow does not deploy)"
            echo "- Quality gate: PASSED"
            echo "- Production smoke verification: PASSED"
            echo "- Vercel CLI token workflow: retired"
          } >> "$GITHUB_STEP_SUMMARY"

name: ZIKR Production Smoke Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to authorize a production verification from main"
        required: true
        type: string
      release_reason:
        description: "Stage or milestone being released"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      SITE_URL: https://zikrmediaofficial.vercel.app
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Lightweight release integrity gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          pnpm verify:pr
        timeout-minutes: 15
      - name: Verify Vercel Git production deployment
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            local expected="$2"
            local body=""
            local status=""

            for attempt in $(seq 1 30); do
              status="$(curl -L -sS -o /tmp/zikr-response.txt -w "%{http_code}" --max-time 30 "$url" || true)"
              body="$(cat /tmp/zikr-response.txt 2>/dev/null || true)"

              if [ "$status" = "200" ] && printf "%s" "$body" | grep -qi "$expected"; then
                echo "PASS $url"
                return 0
              fi


              echo "WAIT $attempt/30 $url -> HTTP ${status:-0}"
              sleep 20
            done


            echo "FAILED $url"
            return 1
          }

          check_url "$SITE_URL/" "ذِكر"
          check_url "$SITE_URL/robots.txt" "Sitemap:"
          check_url "$SITE_URL/sitemap.xml" "<urlset"
      - name: Smoke evidence
        run: |
          {
            echo "## ZIKR Production Release"
            echo ""
            echo "- Stage: ${{ inputs.release_reason }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Deployment: Vercel Git integration"
            echo "- Quality gate: PASSED"
            echo "- Production smoke verification: PASSED"
            echo "- Vercel CLI token workflow: retired"
          } >> "$GITHUB_STEP_SUMMARY"

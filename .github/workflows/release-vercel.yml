name: ZIKR Production Smoke Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to authorize a production verification from main"
        required: true
        type: string
      release_reason:
        description: "Stage or milestone being released"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      SITE_URL: https://zikrmediaofficial.vercel.app
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
undefined      - name: Verify live production
        run: pnpm production:smoke
      - name: Smoke evidence
        run: |
          {
            echo "## ZIKR Production Release"
            echo ""
            echo "- Stage: ${{ inputs.release_reason }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Deployment: Vercel Git integration"
            echo "- Quality gate: PASSED"
            echo "- Production smoke verification: PASSED"
            echo "- Vercel CLI token workflow: retired"
          } >> "$GITHUB_STEP_SUMMARY"

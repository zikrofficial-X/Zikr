name: ZIKR Offline Content Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-offline-content.yml"
      - "scripts/export-offline-content.mjs"
      - "scripts/verify-offline-content.mjs"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: zikr-offline-content-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
    steps:
      - name: Checkout canonical main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare stable review branch from the latest main
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/offline-content-snapshot"
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
            echo "OFFLINE_CONTENT_BRANCH_EXISTS=true" >> "$GITHUB_ENV"
          else
            git checkout -b "$branch" origin/main
            echo "OFFLINE_CONTENT_BRANCH_EXISTS=false" >> "$GITHUB_ENV"
          fi
          echo "OFFLINE_CONTENT_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Validate protected Supabase access
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::Missing canonical SUPABASE_URL." >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::Missing protected SUPABASE_SERVICE_ROLE_KEY." >&2; exit 1; }

      - name: Setup pnpm and Node 22
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Refresh all validated public offline datasets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: pnpm offline:export

      - name: Verify complete snapshot and manifest
        run: pnpm offline:check

      - name: Commit and open a reviewable snapshot pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/offline-content/v1
          if git diff --cached --quiet; then
            if [[ "${OFFLINE_CONTENT_BRANCH_EXISTS}" == "true" ]] && ! git diff --quiet "origin/${OFFLINE_CONTENT_BRANCH}" HEAD; then
              git push origin "${OFFLINE_CONTENT_BRANCH}"
            else
              echo "Offline content snapshot is already current; no PR update is required."
              exit 0
            fi
          else
            git commit -m "chore(content): refresh public offline snapshot"
            git push origin "${OFFLINE_CONTENT_BRANCH}"
          fi

          pr_number="$(gh pr list --base main --head "${OFFLINE_CONTENT_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            if gh pr create \
              --base main \
              --head "${OFFLINE_CONTENT_BRANCH}" \
              --title "chore(content): refresh public offline snapshot" \
              --body "Automated refresh of the validated public offline-content snapshot from canonical Supabase tables. The exporter enforces dataset floors and retains only the integrity-checked tafsir fallback. This PR changes public JSON snapshots only; it does not apply migrations or modify database/storage records. Merge only after the Quality Gate passes."; then
              echo "Created offline snapshot pull request."
            else
              echo "::warning::GitHub Actions token cannot create pull requests in this repository. The validated snapshot branch was pushed; create the PR through the trusted GitHub integration or configure a write-scoped GH_TOKEN secret."
              {
                echo "### Offline snapshot PR creation blocked"
                echo "The snapshot branch was pushed and validated, but the current GitHub Actions token is not allowed to create pull requests."
                echo "Branch: ${OFFLINE_CONTENT_BRANCH}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Updated existing offline snapshot PR #${pr_number}."
          fi

          # Explicitly run the complete Quality Gate against the exact snapshot branch.
          gh workflow run quality-gate.yml --ref "${OFFLINE_CONTENT_BRANCH}"

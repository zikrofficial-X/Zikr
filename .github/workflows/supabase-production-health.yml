name: ZIKR Supabase Production Health

on:
  push:
    branches:
      - main
    paths:
      - "scripts/verify-supabase-production.mjs"
      - "supabase/**"
      - ".github/workflows/supabase-production-health.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-supabase-production-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Supabase production health
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://bbdpitxvfxgephaaqtqj.supabase.co
      # Public anon key for read-only checks; never use the service-role key here.
      SUPABASE_PUBLIC_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiZHBpdHh2ZnhnZXBoYWFxdHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MzMwMjQsImV4cCI6MjEwNzQwOTAyNH0.00-X9BGi3QElmF8VXjasJRc4B-fgH6TUX8SZaOw20ds
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run production Supabase health gate
        run: node scripts/verify-supabase-production.mjs

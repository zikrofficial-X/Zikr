name: ZIKR Supabase Production Health

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-supabase-production-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Supabase production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://wvetcauyerlkqvmntajq.supabase.co
      # Public anon key for read-only checks; never use the service-role key here.
      SUPABASE_PUBLIC_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2ZXRjYXV5ZXJsa3F2bW50YWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTg1ODIsImV4cCI6MjEwNjk5NDU4Mn0.ZqrApyq4rujN4xZHVBNHjvLBHIzubEQpKGmp7hiCdV8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run production Supabase health gate
        run: node scripts/verify-supabase-production.mjs

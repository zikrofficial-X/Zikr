name: ZIKR Supabase Production Health

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-supabase-production-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Supabase production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://wvetcauyerlkqvmntajq.supabase.co
      # Public anon key for read-only checks; never use the service-role key here.
      SUPABASE_PUBLIC_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tZGVhemZtdG5jZWx5a3p4a2hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDE4MTIsImV4cCI6MjEwNjk3NzgxMn0.4Ka127lPTIVkhoRwk_5WhkwE3Tn1PsRYFwECmX0v3Is
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production Supabase health gate
        run: node scripts/verify-supabase-production.mjs

name: Trigger CircleCI Android Release

on:
  push:
    branches:
      - main
    paths:
      - docs/finalization/RELEASE_RETRY.flag
      - .github/workflows/trigger-circleci-android-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-circleci-android-v1.1.2
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger CircleCI v1.1.2
    runs-on: ubuntu-24.04
    env:
      CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN || secrets.CIRCLECI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Release gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f docs/finalization/RELEASE_RETRY.flag && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "No release retry flag; nothing to trigger."
            exit 0
          fi

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < .release-tag)"
          test "$TAG" = "v1.1.2"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Validate CircleCI token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CIRCLE_TOKEN:-}" || {
            echo "Missing GitHub Secret CIRCLE_TOKEN/CIRCLECI_TOKEN." >&2
            exit 1
          }

      - name: Trigger CircleCI release pipeline
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error             --request POST             --url "https://circleci.com/api/v2/project/gh/zikr-org/Zikr/pipeline"             --header "Circle-Token: $CIRCLE_TOKEN"             --header "Accept: application/json"             --header "Content-Type: application/json"             --data "{"tag":"$TAG","parameters":{"run_circleci_ci":true}}")"
          echo "$RESPONSE" | jq .
          PIPELINE_ID="$(echo "$RESPONSE" | jq -r '.id // empty')"
          test -n "$PIPELINE_ID"
          echo "Triggered CircleCI pipeline: $PIPELINE_ID"
name: ZIKR English Content Sync

on:
  workflow_dispatch:
    inputs:
      article_batch_size:
        description: "Number of articles to translate in this run"
        required: false
        default: "5"
      hadith_batch_size:
        description: "Number of Hadith records to synchronize in this run"
        required: false
        default: "25"
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: zikr-english-content-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Bounded English content sync
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://kdotmrjfecgafiommzwz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      TRANSLATION_BATCH_SIZE: ${{ github.event.inputs.article_batch_size || '5' }}
      HADITH_API_BASE_URL: https://ummahapi.com/api/hadith
      HADITH_TRANSLATION_BATCH_SIZE: ${{ github.event.inputs.hadith_batch_size || '25' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Supabase credentials before installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "Missing canonical Supabase URL configuration." >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing production environment secret: SUPABASE_SERVICE_ROLE_KEY" >&2; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
      - name: Run one bounded article batch and one bounded Hadith batch
        shell: bash
        run: |
          set -u
          article_status=0
          hadith_status=0

          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            echo "Translating at most ${TRANSLATION_BATCH_SIZE} published articles."
            pnpm translate:articles:en || article_status=$?
          else
            echo "Missing production environment secret: GEMINI_API_KEY; article translation cannot run." >&2
            article_status=1
          fi

          echo "Synchronizing at most ${HADITH_TRANSLATION_BATCH_SIZE} Hadith records."
          pnpm sync:hadith:en || hadith_status=$?

          if (( article_status != 0 || hadith_status != 0 )); then
            echo "English sync incomplete (articles=${article_status}, hadith=${hadith_status})." >&2
            exit 1
          fi

name: repair-capacitor-lock

on:
  push:
    branches:
      - fix/control-center-production-drift-20261008
    paths:
      - package.json
      - mobile/capacitor-dependencies.json

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/control-center-production-drift-20261008
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm 9.15.0
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged."
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate pnpm lockfile for Capacitor 7"
          git push origin HEAD:fix/control-center-production-drift-20261008

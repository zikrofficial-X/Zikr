name: Create Release Tag

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  tag:
    name: Create immutable release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${BRANCH#release/}"
          SHA="${GITHUB_SHA}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release branch/tag name: $BRANCH" >&2
            exit 1
          fi

          EXPECTED_VERSION="${TAG#v}"
          ACTUAL_VERSION="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${SHA}" --jq '.content' | base64 -d | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "package.json version ($ACTUAL_VERSION) does not match release tag ($TAG)." >&2
            exit 1
          fi

          if TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$TAG_SHA" != "$SHA" ]]; then
              echo "Immutable tag ${TAG} already points to ${TAG_SHA}; refusing to move it." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists at ${SHA}."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${SHA}"
            echo "Created ${TAG} -> ${SHA}"
          fi
          echo "Android Release will start automatically from the tag push."

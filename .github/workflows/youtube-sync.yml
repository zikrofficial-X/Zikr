name: YouTube Feed Sync

# GitHub-hosted runners are currently unavailable for this account without
# billing access. Keep this workflow manual-only so the scheduled job cannot
# create recurring runner/billing failures. The sync logic itself is retained.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-youtube-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY YOUTUBE_API_KEY YOUTUBE_CHANNEL_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::warning::YouTube Feed Sync is not configured: missing secret ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "YouTube Feed Sync skipped because its required repository secrets are not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync YouTube feed cache
        if: steps.validate.outputs.ready == 'true'
        run: pnpm exec tsx scripts/jobs/sync-youtube.ts

name: ZIKR Finalization Controlled Release

on:
  # Production deployment is manual-only; ordinary source pushes never enqueue a skipped release job.
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to authorize a production deployment from main"
        required: true
        type: string
      release_reason:
        description: "Release reason"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: zikr-finalization-production-release
  # Never cancel an active production release between migration and deployment.
  # A queued release revalidates the exact main SHA before it can make changes.
  cancel-in-progress: false

jobs:
  release:
    name: Controlled production release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      VERCEL_ORG_ID: team_RxPjmgZoSFmKGjScefYmwIVv
      VERCEL_PROJECT_ID: prj_bnBQb7DIXB5iE2mZJAghtAoZuKGs
      EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
      PGSSLMODE: require
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the approved main commit and required CI gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Refusing stale production release. Approved SHA ${GITHUB_SHA} is not current main ${current_main}."
            exit 1
          fi
          api="${GITHUB_API_URL:-https://api.github.com}"
          status_json="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
          checks_json="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          export STATUS_JSON="${status_json}" CHECKS_JSON="${checks_json}"
          python3 - <<'PY'
          import json
          import os
          import sys

          status = json.loads(os.environ["STATUS_JSON"])
          checks = json.loads(os.environ["CHECKS_JSON"])
          required = {
              "ci/circleci: config-guard",
              "ci/circleci: source-verify",
              "ci/circleci: application-build-docs",
              "ci/circleci: android-release-draft",
          }
          statuses = {item.get("context"): item.get("state") for item in status.get("statuses", [])}
          missing = sorted(required - statuses.keys())
          failing = sorted(context for context in required if statuses.get(context) != "success")
          if status.get("state") != "success" or missing or failing:
              print("Required commit statuses are not all successful.", file=sys.stderr)
              print("Missing: " + ", ".join(missing), file=sys.stderr)
              print("Not successful: " + ", ".join(failing), file=sys.stderr)
              sys.exit(1)

          quality_runs = [
              run for run in checks.get("check_runs", [])
              if run.get("name") == "ZIKR / Quality Gate" and run.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          if not quality_runs:
              print("The exact release commit has no ZIKR / Quality Gate check run.", file=sys.stderr)
              sys.exit(1)
          latest = max(quality_runs, key=lambda run: run.get("started_at") or "")
          if latest.get("status") != "completed" or latest.get("conclusion") != "success":
              print("The latest ZIKR / Quality Gate run is not successful.", file=sys.stderr)
              sys.exit(1)
          print("PASS: current main SHA, CircleCI required contexts, and ZIKR Quality Gate are successful.")
          PY

      # Prefer the dedicated rotated token, but accept common GitHub secret names too. These are GitHub Actions secrets, not Vercel project environment variables.
      - name: Verify Vercel deployment credential is available
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.ZIKR_VERCEL_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error title=Missing Vercel deployment credential::Add the token as a GitHub Actions SECRET named ZIKR_VERCEL_TOKEN (preferred), VERCEL_DEPLOY_TOKEN, or VERCEL_TOKEN in repository secrets or the production environment. Vercel project Environment Variables are not available to this GitHub Actions workflow."
            exit 1
          fi
          echo "Vercel deployment credential is present."

      - name: Verify Supabase admin connection
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error title=Missing Supabase admin connection::Add SUPABASE_DB_URL using POSTGRES_URL_NON_POOLING or a direct administrative connection for the canonical Supabase project."
            exit 1
          fi
          python3 scripts/verify-supabase-db-url.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
        timeout-minutes: 15

      - name: Verify exact release flag
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < docs/finalization/PRODUCTION_RELEASE.flag)" = "RELEASE"
          test "${{ github.ref }}" = "refs/heads/main"

      - name: Verify release contract
        run: pnpm release:contract:check

      - name: Re-run release integrity gate
        run: pnpm verify:pr
        timeout-minutes: 15

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@63.1.2

      - name: Validate Vercel release configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.ZIKR_VERCEL_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${VERCEL_ORG_ID:-}"
          test -n "${VERCEL_PROJECT_ID:-}"

      - name: Authenticate and link exact Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.ZIKR_VERCEL_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          # Fail with a readable annotation instead of a bare "exit code 1".
          if ! who="$(vercel whoami 2>&1)"; then
            details="$(printf '%s' "$who" | tail -n 3 | tr '\n' ' ' | cut -c1-300)"
            if grep -Eqi 'User not found|token.*not valid|invalid token|401|403' <<< "$details"; then
              echo "::error title=Vercel token identity lookup failed::Vercel rejected or could not resolve the account for VERCEL_TOKEN. The secret exists, but authentication is not valid for the Vercel API. Verify the token with Vercel CLI 63.1.2 and ensure it belongs to an active account with access to team zikr3."
            else
              echo "::error title=Vercel authentication failed::$details"
            fi
            exit 1
          fi
          echo "Authenticated to Vercel as: ${who}"
          # Pin the project through project.json (orgId = team id) so no slug/scope lookup is needed.
          rm -rf .vercel && mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "${VERCEL_ORG_ID}" "${VERCEL_PROJECT_ID}" > .vercel/project.json
          if ! project_info="$(vercel project inspect "${VERCEL_PROJECT_ID}" --scope "${VERCEL_ORG_ID}" 2>&1)"; then
            details="$(printf '%s' "${project_info}" | tail -n 4 | tr '\n' ' ' | cut -c1-350)"
            echo "::error title=Vercel project access failed::The token authenticated, but project ${VERCEL_PROJECT_ID} could not be accessed in team ${VERCEL_ORG_ID}: ${details}"
            exit 1
          fi
          echo "Configured Vercel project access verified before production database changes."

      - name: Install PostgreSQL client for production schema verification
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify Supabase Edge Function deployment credential before production changes
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error title=Missing Supabase Edge Function deployment credential::Add SUPABASE_ACCESS_TOKEN to the GitHub Actions production environment before running this release."
            exit 1
          fi
          projects="$(supabase projects list 2>&1)"
          if ! grep -Fq "${EXPECTED_PROJECT_REF}" <<< "${projects}"; then
            echo "::error title=Supabase token cannot access the canonical project::The supplied SUPABASE_ACCESS_TOKEN did not list project ${EXPECTED_PROJECT_REF}."
            exit 1
          fi
          echo "Supabase CLI access to the canonical project is verified."

      - name: Verify production data and baseline schema against parent commit
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL_NON_POOLING }}
          EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
        run: |
          set -euo pipefail
          baseline="/tmp/zikr-schema-baseline"
          git worktree add --detach "${baseline}" "${GITHUB_SHA}^"
          cp scripts/reconcile-supabase-migration-history.sh "${baseline}/scripts/reconcile-supabase-migration-history.sh"
          (
            cd "${baseline}"
            TAFSIR_EXPECTED_COUNT=0,6236 bash scripts/reconcile-supabase-migration-history.sh
          )

      - name: Pull production Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.ZIKR_VERCEL_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          if ! out="$(vercel pull --yes --environment=production --scope "${VERCEL_ORG_ID}" 2>&1)"; then
            echo "::error title=vercel pull failed::$(printf '%s' "$out" | tail -n 4 | tr '\n' ' ' | cut -c1-350)"
            exit 1
          fi
          printf '%s\n' "$out" | tail -n 3

      - name: Verify Apple App Site Association configuration before production build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          env_file = Path(".vercel/.env.production.local")
          if not env_file.is_file():
              print("::error title=Missing pulled Vercel production environment::Expected .vercel/.env.production.local after vercel pull.", file=sys.stderr)
              sys.exit(1)

          app_id = ""
          for line in env_file.read_text(encoding="utf-8").splitlines():
              if line.startswith("IOS_ASSOCIATED_DOMAIN_APP_ID="):
                  app_id = line.split("=", 1)[1].strip().strip('"').strip("'")
                  break

          if not re.fullmatch(r"[A-Z0-9]{10}\.com\.zikr\.app", app_id):
              print("::error title=Missing iOS Universal Links App ID::Set IOS_ASSOCIATED_DOMAIN_APP_ID to the real Apple Team ID plus .com.zikr.app in the Vercel production environment. The AASA route would otherwise be built without an app association.", file=sys.stderr)
              sys.exit(1)
          print("PASS: iOS Universal Links App ID is configured for the production build.")
          PY

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.ZIKR_VERCEL_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || secrets.VERCEL_TOKEN }}
        run: vercel build --prod --scope "${VERCEL_ORG_ID}"

      - name: Recheck approved main SHA immediately before production database changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Refusing production database changes because main advanced during the build. Approved SHA ${GITHUB_SHA}; current main ${current_main}."
            exit 1
          fi

      - name: Apply pending production migrations before deployment
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL_NON_POOLING }}
          EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
        run: |
          set -euo pipefail
          python3 scripts/verify-supabase-db-url.py
          supabase db push --db-url "${SUPABASE_DB_URL}" --yes

      - name: Restore source-verified Quran tafsir corpus
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL_NON_POOLING }}
          EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
        run: bash scripts/restore-quran-tafsir.sh

      - name: Verify production schema after migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL_NON_POOLING }}
          EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
          TAFSIR_EXPECTED_COUNT: "6236"
        run: bash scripts/reconcile-supabase-migration-history.sh

      - name: Recheck approved main SHA immediately before Edge Function deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Refusing stale Supabase Edge Function deployment. Approved SHA ${GITHUB_SHA}; current main ${current_main}."
            exit 1
          fi

      - name: Deploy source-controlled Supabase Edge Functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
        run: |
          set -euo pipefail
          # Both changed functions are deployed under the same approved-SHA preflight.
          supabase functions deploy prayer-notification-worker --project-ref "${EXPECTED_PROJECT_REF}"

      - name: Recheck approved main SHA immediately before source-agent deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Refusing stale source-agent deployment. Approved SHA ${GITHUB_SHA}; current main ${current_main}."
            exit 1
          fi

      - name: Deploy source-verified content agent Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
        run: |
          set -euo pipefail
          supabase functions deploy source-verified-content-agent --project-ref "${EXPECTED_PROJECT_REF}"


      - name: Recheck approved main SHA immediately before production deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Refusing production deployment because main advanced during the build. Approved SHA ${GITHUB_SHA}; current main ${current_main}."
            exit 1
          fi

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.ZIKR_VERCEL_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --scope "${VERCEL_ORG_ID}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Production smoke test after schema migration and deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm production:smoke

      - name: Release evidence
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          RELEASE_REASON: ${{ inputs.release_reason || 'Finalization release' }}
        run: |
          {
            echo "## ZIKR Finalization Production Release"
            echo ""
            echo "- Commit: ${{ github.sha }}"
            echo "- Reason: ${RELEASE_REASON}"
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Vercel Git auto-deploy: DISABLED"
            echo "- Controlled release trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: ZIKR Finalization Controlled Release

on:
  push:
    branches:
      - main
    paths:
      - "docs/finalization/PRODUCTION_RELEASE.flag"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to authorize a production deployment from main"
        required: true
        type: string
      release_reason:
        description: "Release reason"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-finalization-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Controlled production release
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RELEASE') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[PRODUCTION RELEASE]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
        timeout-minutes: 15

      - name: Verify exact release flag
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < docs/finalization/PRODUCTION_RELEASE.flag)" = "RELEASE"
          test "${{ github.ref }}" = "refs/heads/main"

      - name: Re-run release integrity gate
        run: pnpm verify:pr
        timeout-minutes: 15

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.23.1

      - name: Validate Vercel release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${VERCEL_ORG_ID:-}"
          test -n "${VERCEL_PROJECT_ID:-}"

      - name: Link exact Vercel project
        run: |
          rm -rf .vercel
          vercel link --yes --project="${VERCEL_PROJECT_ID}" --scope="${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"

      - name: Pull production Vercel configuration
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build production artifact
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Release evidence
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          RELEASE_REASON: ${{ inputs.release_reason || 'Finalization release' }}
        run: |
          {
            echo "## ZIKR Finalization Production Release"
            echo ""
            echo "- Commit: ${{ github.sha }}"
            echo "- Reason: ${RELEASE_REASON}"
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Vercel Git auto-deploy: DISABLED"
            echo "- Controlled release trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

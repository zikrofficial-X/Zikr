name: Continuous Integration

# GitHub-hosted runners are currently unavailable for this account. Vercel now
# executes `pnpm verify` for every deployment; retain this workflow as an
# operator-invoked fallback for when runner access is restored.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run verification suite
        run: pnpm verify

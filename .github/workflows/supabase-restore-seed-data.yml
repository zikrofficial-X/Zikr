name: "ZIKR / Restore Supabase Seed Data"

# Manual, idempotent restore of the Quran tafsir seed data into the connected
# Supabase project. The 9 tafsir migrations are too large to apply through the
# Supabase connector, so they are applied here with psql. Every statement uses
# ON CONFLICT DO UPDATE, so running this workflow more than once is safe.
#
# Required repository/environment secret: SUPABASE_DB_URL (use POSTGRES_URL_NON_POOLING
# from the Vercel Supabase integration, or the direct connection string).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type restore to apply the tafsir seed data"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: zikr-supabase-seed-restore
  cancel-in-progress: false

jobs:
  restore-tafsir:
    name: Restore Quran tafsir
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      EXPECTED_PROJECT_REF: zqtssvlvmkzeeyqghqfk
      PGSSLMODE: require
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Verify the exact production database endpoint and TLS
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/verify-supabase-db-url.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Run the canonical guarded and atomic tafsir restore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/restore-quran-tafsir.sh

      - name: Verify the complete tafsir corpus
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          count="$(psql "$SUPABASE_DB_URL" -At -c "select count(*) from public.quran_tafsir where author = 'التفسير الميسر'")"
          echo "Source-verified quran_tafsir rows: $count"
          [[ "$count" == "6236" ]] || {
            echo "Expected exactly 6,236 source-verified tafsir rows; found $count." >&2
            exit 1
          }

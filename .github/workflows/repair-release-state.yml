name: Repair Release State

on:
  push:
    paths:
      - '.github/workflows/repair-release-state.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Repair release metadata and workflow wiring
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json, re

          version = json.loads(Path('package.json').read_text())['version']
          if version != '1.4.16':
              raise SystemExit(f'Expected package version 1.4.16, found {version}')

          gradle = Path('android/app/build.gradle').read_text()
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 47', gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.4.16"', gradle, count=1)
          Path('android/app/build.gradle').write_text(gradle)

          Path('.release-tag').write_text('v1.4.16\n')
          Path('PACKAGE_VERSION.txt').write_text('ZIKR v1.4.16\nversionCode=47\napplicationId=com.zikr.app\ntargetSdk=36\n')

          workflow = Path('.github/workflows/create-release-tag.yml').read_text()
          if '  actions: write' not in workflow:
              workflow = workflow.replace('permissions:\n  contents: write', 'permissions:\n  contents: write\n  actions: write', 1)
          Path('.github/workflows/create-release-tag.yml').write_text(workflow)

          android_workflow = Path('.github/workflows/android-release.yml').read_text()
          android_workflow = android_workflow.replace("    branches:\n      - 'release/v*'\n", '')
          Path('.github/workflows/android-release.yml').write_text(android_workflow)

          marker = Path('release-v1.4.16-marker.txt')
          if marker.exists():
              marker.unlink()
          PY

      - name: Commit repaired release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zikrmediaofficial"
          git config user.email "hiddennarratives.contact@gmail.com"
          git add android/app/build.gradle .release-tag PACKAGE_VERSION.txt .github/workflows/create-release-tag.yml .github/workflows/android-release.yml release-v1.4.16-marker.txt || true
          if git diff --cached --quiet; then
            echo "No release-state changes required."
            exit 0
          fi
          git commit -m "fix(release): synchronize v1.4.16 metadata and workflow"
          git push origin HEAD:main

name: Repair Release State

on:
  push:
    paths:
      - '.github/workflows/repair-release-state.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Repair release metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json, re

          version = '1.4.17'
          package = json.loads(Path('package.json').read_text())
          package['version'] = version
          Path('package.json').write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          gradle = Path('android/app/build.gradle').read_text()
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 48', gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.4.17"', gradle, count=1)
          Path('android/app/build.gradle').write_text(gradle)

          Path('.release-tag').write_text('v1.4.17\n')
          Path('PACKAGE_VERSION.txt').write_text('ZIKR v1.4.17\nversionCode=48\napplicationId=com.zikr.app\ntargetSdk=36\n')
          PY

      - name: Commit repaired release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zikrmediaofficial"
          git config user.email "hiddennarratives.contact@gmail.com"
          git add package.json android/app/build.gradle .release-tag PACKAGE_VERSION.txt
          if git diff --cached --quiet; then
            echo "No release-state changes required."
            exit 0
          fi
          git commit -m "fix(release): synchronize v1.4.17 metadata"
          git push origin HEAD:main
